# Every yadgarhq repo carries pre-commit (D59).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-yaml
        # Argo CRDs and multi-document manifests.
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-toml
  # Shared, from yadgarhq/actions (D62) — this was a near-identical local block
  # in every repository until the shared definition existed.
  - repo: https://github.com/yadgarhq/actions
    rev: v1
    hooks:
      - id: gitleaks
