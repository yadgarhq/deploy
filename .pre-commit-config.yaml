# Every yadgarhq repo carries pre-commit (D59).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-yaml
        # Argo CRDs and multi-document manifests.
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-toml
  # Shared, from yadgarhq/actions (D62) — this was a near-identical local block
  # in every repository until the shared definition existed.
  # IMMUTABLE rev, unlike the @v1 the workflow caller pins. pre-commit caches a
  # rev at first install and never re-resolves it — "mutable references are never
  # updated after first install and are not supported" — so a moving tag here
  # would silently freeze each machine at whatever v1 meant the day it first ran.
  # GitHub Actions re-resolves @v1 every run; pre-commit does not. Bump with
  # `pre-commit autoupdate`.

  - repo: https://github.com/yadgarhq/actions
    rev: v1.20.1
    hooks:
      - id: gitleaks
      - id: prettier
      # No Containerfile here yet; the hook is a no-op until one arrives, which is
      # cheaper than remembering to add it on the day it does.
      - id: hadolint
      # A CONSUMER IS NOT LINTED UNTIL IT REFERENCES THE HOOK, which is why this
      # line exists rather than being inherited. This repository has a
      # `.github/workflows/` and nothing read it: `ci-pr.yaml` installs the
      # `actionlint` binary unconditionally and `yadgarhq/actions` publishes the
      # hook, but publication makes a check AVAILABLE rather than switching it on
      # (ledger 620, ADR-0577).
      #
      # The hook REFUSES rather than passes when actionlint's shellcheck rule
      # class is not running: actionlint silently disables that whole class when
      # the binary is absent, and "Passed, having checked nothing" is the defect
      # the guard closes rather than a state this check may report.
      - id: actionlint

      # NO `certificate-usages` HERE ANY MORE (ledger 720's EKU wall). Step 5 of
      # `plans/retiring-the-deploy-copies.md` moved the internal CA and its ten
      # leaves to the parent chart, which left this repository ONE Certificate —
      # the edge leaf — and the hook refuses fewer than two (its
      # `MINIMUM_CERTIFICATES` / `MINIMUM_LEAVES`). It also skips templated
      # files, so it cannot read the chart the leaves now live in. The wall
      # moved to a render-time `usages` assertion in `yadgarhq/platform`'s own
      # suite, which is where the leaves are declared (ruled 2026-09-27;
      # platform#19). The edge leaf followed at step 7, when
      # `infra/tls/certificate.yaml` became `platform.edgeTLS.create`; the
      # same suite renders it and holds it to exactly one direction, so the
      # local `certificate-usages-edge` hook that kept it guarded until then
      # left in that merge (ADR-0804). This repository declares no Certificate.
      - id: no-test-skips

  - repo: local
    hooks:
      # NO `policy-sources-named` HOOK HERE ANY MORE. It read every
      # `kind: NetworkPolicy` manifest in the repository (`scripts/
      # policy_sources_named.py`) and was this repository's other
      # `always_run` / `pass_filenames: false` local hook, for the identical
      # reason `scripts-tests` below gives. It left at M5 of the `infra`
      # retirement (ADR-0828) along with its last subject,
      # `infra/estate-front/networkpolicy.yaml`: both are ported to
      # `yadgarhq/argocd` as `scripts/policy_sources_named.py` and
      # `manifests/estate-front/networkpolicy.yaml`, which carry the gate
      # forward over argocd's own `manifests/`.
      #
      # NO JOB RUNS `scripts/tests/` ANY MORE EITHER, AND THAT WAS A GAP THIS
      # MERGE OPENED RATHER THAN CLOSED. The deleted `two-owners` CI job
      # (`.github/workflows/ci.yaml`) was the ONLY runner of
      # `scripts/tests/test_no_two_owners.py`; the shared `ci-pr.yaml`'s
      # `test` job SKIPS here (this repository builds nothing `go test` or
      # `cargo test` would run), so nothing in the shared workflow ever ran
      # pytest. `scripts/tests/test_infra_retired.py` — this repository's
      # current gate, M5's replacement of `test_infra_children_handed_over.py`
      # — would therefore run NOWHERE without this hook: written, never
      # executed, exactly the defect the EKU wall and `no-test-skips` both
      # exist to catch.
      #
      # OFFLINE, DELIBERATELY, unlike the old `two-owners` CI job. It reads
      # `infra/*.yaml` and nothing else — no `helm`, no registry — so it
      # belongs here rather than as a new GitHub Actions job.
      #
      # `always_run` / `pass_filenames: false`: the suite's whole point is to
      # notice an ABSENCE (no Application manifest declared under `infra/` at
      # all, now that `infra` itself is retired), and a hook handed only the
      # changed-file list cannot see a file that is not there.
      - id: scripts-tests
        name: scripts/tests passes (ledger 1212's two-owners gap, ADR-0824)
        entry: python -m pytest scripts/tests -q
        language: python
        additional_dependencies: ["pyyaml==6.0.3", "pytest==8.4.2"]
        always_run: true
        pass_filenames: false
