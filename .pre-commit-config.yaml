# Every yadgarhq repo carries pre-commit (D59).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-yaml
        # Argo CRDs and multi-document manifests.
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-toml
  # Shared, from yadgarhq/actions (D62) — this was a near-identical local block
  # in every repository until the shared definition existed.
  # IMMUTABLE rev, unlike the @v1 the workflow caller pins. pre-commit caches a
  # rev at first install and never re-resolves it — "mutable references are never
  # updated after first install and are not supported" — so a moving tag here
  # would silently freeze each machine at whatever v1 meant the day it first ran.
  # GitHub Actions re-resolves @v1 every run; pre-commit does not. Bump with
  # `pre-commit autoupdate`.

  - repo: https://github.com/yadgarhq/actions
    rev: v1.20.1
    hooks:
      - id: gitleaks
      - id: prettier
      # No Containerfile here yet; the hook is a no-op until one arrives, which is
      # cheaper than remembering to add it on the day it does.
      - id: hadolint
      # A CONSUMER IS NOT LINTED UNTIL IT REFERENCES THE HOOK, which is why this
      # line exists rather than being inherited. This repository has a
      # `.github/workflows/` and nothing read it: `ci-pr.yaml` installs the
      # `actionlint` binary unconditionally and `yadgarhq/actions` publishes the
      # hook, but publication makes a check AVAILABLE rather than switching it on
      # (ledger 620, ADR-0577).
      #
      # The hook REFUSES rather than passes when actionlint's shellcheck rule
      # class is not running: actionlint silently disables that whole class when
      # the binary is absent, and "Passed, having checked nothing" is the defect
      # the guard closes rather than a state this check may report.
      - id: actionlint

      # NO `certificate-usages` HERE ANY MORE (ledger 720's EKU wall). Step 5 of
      # `plans/retiring-the-deploy-copies.md` moved the internal CA and its ten
      # leaves to the parent chart, which left this repository ONE Certificate —
      # the edge leaf — and the hook refuses fewer than two (its
      # `MINIMUM_CERTIFICATES` / `MINIMUM_LEAVES`). It also skips templated
      # files, so it cannot read the chart the leaves now live in. The wall
      # moved to a render-time `usages` assertion in `yadgarhq/platform`'s own
      # suite, which is where the leaves are declared (ruled 2026-09-27;
      # platform#19). The edge leaf this repository still declares keeps the
      # same rule in the local `certificate-usages-edge` hook below.
      - id: no-test-skips

  - repo: local
    hooks:
      # LOCAL, AND FOR A REASON ONE LEVEL UP FROM THE ONE ABOVE. The runner scale set
      # exists only here, so a definition in yadgarhq/actions would be a hook
      # that is a no-op in fifteen repositories. What it guards is the one image
      # reference in this repository naming an artefact this organisation builds
      # itself, and nothing else in the estate covers it: `versions/` and its
      # gate live in yadgarhq/argocd and see `yadgar-deployable` modules, which
      # the runner is not (ledger 742).
      #
      # THE STRUCTURAL HALF ONLY. `--verify-signature` needs cosign and a
      # reachable registry, and it REFUSES rather than skips without them — so
      # running it here would redden every commit made on a train. That half
      # runs in the `signature` job of .github/workflows/ci.yaml instead.
      #
      # THE ABSENCE OF THE KEY IS THE FAILURE, so the changed-file list cannot
      # be the input — the same reason yadgarhq/argocd's `versions-pinned` says
      # so. Delete the `image` value and the chart falls back to its own default
      # runner image; a hook scoped to `files:` would then be handed a manifest
      # with nothing to check and would pass.
      - id: runner-image-pinned
        name: the ARC runner pod is pinned to a digest CI published (ledger 742)
        entry: python scripts/runner_image_pinned.py
        language: python
        additional_dependencies: ["pyyaml==6.0.3"]
        always_run: true
        pass_filenames: false

      # LOCAL FOR THE FIRST OF THE TWO REASONS ABOVE: this repository is the only
      # one in the estate declaring a `kind: NetworkPolicy` as a plain manifest.
      # `yadgarhq/platform` asks the same question of its chart, in
      # `scripts/tests/test_shared_infrastructure.py`, and the matcher functions
      # here are COPIED from there rather than re-derived (ADR-0679) — a second
      # derivation of "what counts as a from-less rule" is a second set of bugs.
      #
      # THE SAME `always_run` / `pass_filenames: false` PAIR AS THE HOOK ABOVE,
      # and for the same reason it gives: the absence of the rule is the failure,
      # so the changed-file list cannot be the input. Deleting the 8222 rule's
      # `from` and deleting the whole policy must both redden, and a hook handed
      # only what changed cannot see the second.
      - id: policy-sources-named
        name: every ingress rule names a source, and 8222 names this namespace
        entry: python scripts/policy_sources_named.py
        language: python
        additional_dependencies: ["pyyaml==6.0.3"]
        always_run: true
        pass_filenames: false

      # THE EKU WALL FOR THE ONE CERTIFICATE LEFT HERE, `infra/tls/certificate.yaml`
      # (ADR-0804). The shared `certificate-usages` hook left with step 5; this
      # runs the same `judge()` rule with a floor of 1. It retires at step 7,
      # with the file and with `scripts/tests/test_certificate_usages.py`.
      - id: certificate-usages-edge
        name: the edge leaf names exactly one direction (ledger 720)
        entry: python -m pytest scripts/tests/test_certificate_usages.py -q
        language: python
        additional_dependencies: ["pyyaml==6.0.3", "pytest==8.4.2"]
        always_run: true
        pass_filenames: false
