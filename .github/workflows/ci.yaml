name: ci

# CI is defined once in yadgarhq/actions (D62). This file is the whole of this
# repository's CI configuration: the shared workflow detects what the repository
# is and runs what applies.
#
# NO WORKFLOW-LEVEL `permissions:` BLOCK, deliberately. A job cannot ask for more
# than the workflow grants, so a top-level `contents: read` makes the release
# job's `packages: write` invalid — and the failure is a run with ZERO JOBS and
# no logs, which says nothing about permissions. Each job states its own instead.
#
# Push to main runs the version report only. Validating there would re-run what
# the pull request just passed, on code already merged, with nobody watching —
# and the ruleset makes direct pushes impossible, so there is no drift to catch.
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  # THE PULL REQUEST GATE, AND IT CARRIES NO CREDENTIAL. `ci-pr.yaml` serves both
  # events, so one job calling it for both handed the release App's private key
  # to every pull-request run — a run that builds and tests the branch's own
  # code. These are branch pull requests rather than fork ones, so GitHub does
  # pass secrets to them, and the App holds `Contents: Read and write` on every
  # repository in the organisation.
  #
  # The pull request has no use for it either: `version` is the only job that
  # reads those secrets, and its own condition is `push` to `refs/heads/main`.
  # So the split costs nothing and removes the whole exposure.
  #
  # THE NAME `ci` IS LOAD-BEARING. The ruleset on `main` requires the check
  # `ci / passed`, which is `<caller job id> / <called job id>` — renaming this
  # job breaks the merge gate rather than reporting anything.
  ci:
    if: github.event_name == 'pull_request'
    uses: yadgarhq/actions/.github/workflows/ci-pr.yaml@main
    permissions:
      contents: read

  # THE SAME SHARED WORKFLOW ON THE PUSH PATH, where the credential is needed
  # and where nothing unreviewed runs. A push to `main` here is a merge that has
  # already passed `ci / passed`; the ruleset forbids any other kind.
  #
  # NAMED RATHER THAN `secrets: inherit`, and that is the estate's own tooling
  # deciding rather than a preference. `inherit` was the chosen form — same
  # organisation, same control, one line instead of three — and zizmor's
  # `secrets-inherit` audit fails it at High confidence, which reddens the
  # `ci / workflows` job of this very workflow. The audit is right about why:
  # inherit passes every organisation and repository secret the caller can see,
  # not the two the callee declares, and it GROWS SILENTLY, since a secret added
  # to the organisation later would flow into this call with nobody editing this
  # file. Naming the two is the fix the audit asks for, not a suppression of it.
  main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: yadgarhq/actions/.github/workflows/ci-pr.yaml@main
    permissions:
      contents: read
    secrets:
      RELEASE_APP_CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

  release:
    if: startsWith(github.ref, 'refs/tags/')
    uses: yadgarhq/actions/.github/workflows/ci-release.yaml@main
    with:
      version: ${{ github.ref_name }}
    permissions:
      contents: read
      packages: write
      id-token: write

  # THE SIGNATURE HALF OF THE RUNNER PIN GATE (ledger 742), AND THE ONLY JOB IN
  # THIS FILE THAT IS NOT SHARED. `scripts/runner_image_pinned.py` runs as a
  # pre-commit hook and checks the SHAPE of the pin offline; asking whether the
  # digest carries a signature needs cosign and the registry, which no hook may
  # depend on. Same script, second mode, so the two halves cannot disagree about
  # which references are the subject.
  #
  # IT IS NOT A MERGE GATE YET, AND THAT HAS TO BE SAID RATHER THAN IMPLIED. The
  # `main` ruleset requires exactly one status check, `ci / passed`, which is the
  # shared workflow's own aggregate — this job is not inside it and is not named
  # by the ruleset, so a red cross here blocks nothing. MIGRATION_NOTES.md
  # carries the one change that would make it required; it is the operator's to
  # make. This is the same trap `yadgarhq/argocd`'s `versions_pinned.py` header
  # names when it explains why that check is a hook and not a workflow of its
  # own, and it is why the STRUCTURAL half went to the hook rather than here.
  #
  # PULL REQUESTS ONLY. On `push` to main it would re-ask, against merged code,
  # a question the pull request just answered.
  signature:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: install PyYAML
        run: python3 -m pip install --disable-pip-version-check "pyyaml==6.0.3"

      # THE SAME PIN THE PUBLISHING WORKFLOW USES. `yadgarhq/actions`'s
      # `estate-runner image` workflow signs with this action at this digest;
      # verifying with a different cosign major is a question nobody asked.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # NO REGISTRY CREDENTIAL, DELIBERATELY, and it matches how the pod pulls.
      # `infra/estate-front-runner.yaml` carries no `imagePullSecrets` and the
      # package is public (ledger 661), so an anonymous verify asks the same
      # question the kubelet asks. A verify that only works when authenticated
      # would stay green through a visibility flip that the cluster experiences
      # as ImagePullBackOff.
      - name: the pinned digest carries CI's signature
        run: python3 scripts/runner_image_pinned.py --verify-signature
