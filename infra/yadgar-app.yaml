# THE WHOLE OF YADGAR, AS THE ONE APPLICATION AN ADOPTER INSTALLS (ADR-0786).
#
# This organisation's Argo CD deploys the estate as ONE Application pointing at
# the published parent chart with a values file, and THIS Application IS the
# adopter's install. Nothing here is a copy of anything: the seven module
# Applications that the `yadgar-modules` ApplicationSet generates from each
# module repository's branch HEAD are retired by the cutover, so a module change
# reaches this cluster by a published parent-chart VERSION and never by a merge
# to a module's main.
#
# Step 2 of `plans/dogfooding-the-parent-chart.md` in `yadgarhq/docs`.
#
# `syncPolicy.automated` IS HERE NOW, AND STEP 5 OF THE PLAN IS WHAT ADDED IT.
# Step 2 left it out deliberately: without it Argo computes a diff and applies
# nothing, so the multi-source form below — OCI chart plus a values file out of
# this repository — was proved against the live estate while the estate could
# not be written to. A wrong `$values` path failed there, visibly, with nothing
# touched. It did not fail.
#
# `prune: true` IS THE HALF THAT CARRIES THE RISK, AND THE ORDERING IS THE
# CONTROL. An Application whose values file renders fewer objects than the
# estate holds deletes the difference the first time it prunes. Step 4's manual
# sync is what establishes this values file is not that one: a values file
# missing `autoscaling.enabled` renders 38 objects and every one of the 38
# matches, so a key-by-key check alone passes while 7 ScaledObjects and 6
# NetworkPolicies are pruned. Set equality is what catches it. This block
# therefore lands only after that sync has been read, never beside it.
#
# NO `Replace=true` AND NO `ServerSideApply=true`, per D83: either one would let
# an immutable-field change become a delete-and-recreate of a live Service.
#
# THE `ignoreDifferences` BLOCK IS HERE NOW, AND MERGE B OF
# `plans/the-mariadb-crs-into-the-chart.md` IS WHAT MOVED IT. It came verbatim
# from `infra/databases-app.yaml`, which merge A deleted, and it matches the
# block the chart's own `example/application.yaml` carries from 0.2.37 — two
# `generate` pointers, one entry, no `name`, so it holds for all three
# databases. It belongs here because this Application now RENDERS the three
# MariaDB CRs: the three `database.create` toggles are true in
# `infra/yadgar/values.yaml` as of the same merge. Without it the operator's
# writeback of the generated credential's name reads as drift, `selfHeal`
# reverts it, the operator writes it again, and the two loop.
#
# NO `argocd.argoproj.io/sync-wave`, WHICH IS WHAT THE PLAN SPECIFIES AND IS A
# DIFFERENCE FROM WHAT THIS REPLACES. The `yadgar-modules` ApplicationSet
# annotates its generated Applications `sync-wave: "10"` so services deploy after
# the infra, operators and databases waves. This Application defaults to wave 0.
# The consequence is ordering, not breakage — a module pod started before its
# database or certificate exists sits in `ContainerCreating` until the Secret
# arrives, which is the estate's documented "slower rather than broken" shape.
# Raised against the plan rather than corrected here by hand.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: yadgar
  namespace: argocd
spec:
  project: default
  # TWO SOURCES, AND THE SECOND ONE RENDERS NOTHING. `ref: self` with no `path`
  # makes this repository available to the first source as `$self`, which is how
  # an Argo Application feeds a values file out of git to a chart pulled from an
  # OCI registry. This estate has never run the multi-source form before, so
  # proving it is half of what step 2 is for.
  sources:
    - repoURL: ghcr.io/yadgarhq/charts
      chart: yadgar
      # PINNED BY HAND, ONE LINE PER PULL REQUEST, AND NOTHING WRITES IT.
      # Measured 2026-09-27 on the pulled artifact
      # (digest sha256:5b092b8db408c096f715b0e4d3caad2eed1df6dcef577e588d3e006069a54567):
      # `0.2.42` pins gateway 0.9.52, iam 0.8.44, iam-db 0.7.46, project 0.1.19,
      # project-db 0.3.10, task 0.5.30, task-db 0.6.34, config 0.2.0 and
      # platform 0.1.17. Only the LAST of those moved from `0.2.38`: each of the
      # other eight vendored subchart directories is byte-identical between the
      # two pulled artifacts, so no module image digest moves, no module pod
      # rolls for a new image and no `-db` migration runs. `push_validation` for
      # the tag's commit `71db3d4` is `success` — that read is the only gate this
      # pin has, because `ci-release.yaml`'s `release` job carries no `needs:`
      # on it.
      #
      # WHAT `platform` 0.1.14 TO 0.1.17 CARRY: `fullnameOverride: nats` on the
      # NATS subchart (platform#16, first released in 0.1.15, ADR-0805);
      # `Prune=false` on the vendored CRDs (#17); the edge issuer defaulting to
      # the internal CA (#18); a render-time usages test (#19). Only the first
      # changes this render: the CRDs sit behind `operators.create` and the edge
      # Certificate behind `edgeTLS.create`, both false in
      # `infra/yadgar/values.yaml`.
      #
      # K3, THE RENDER DIFF THIS BUMP WAS GATED ON, BEFORE THE MERGE. `prune:
      # true` and `selfHeal: true` are live below, so a parent rendering FEWER
      # objects deletes the difference unattended. On helm 4.3.0, `--namespace
      # yadgar` and the six `--api-versions` this chart's `require-api` helpers
      # and capability guards name, 0.2.38 at `main`'s values against 0.2.42 at
      # this merge's: 70 objects on both sides; the five `yadgar-nats*` broker
      # objects (`StatefulSet`, `Service`, `PodDisruptionBudget`,
      # `Service/yadgar-nats-headless`, `ConfigMap/yadgar-nats-config`) removed;
      # the five `nats*` objects added, equal to the removed ones in every field
      # but their names; `NATS_URL` in `Deployment/iam` and `Deployment/gateway`
      # moved from `nats://yadgar-nats:4222` to `nats://nats:4222`; and the other
      # 63 objects byte-identical.
      #
      # SO THIS SYNC IS A NATS CUTOVER, A DELETE-THEN-ADOPT AND NOT A RENAME
      # (B5 of `plans/the-one-application-install.md`). Argo prunes the five
      # `yadgar-nats*` objects and creates five `nats*` ones, and `iam` and
      # `gateway` roll onto the module default url in the same sync. The two
      # url lines left `infra/yadgar/values.yaml` in this merge, the retiring
      # plan's 6a coupling: kept, they dial a Service 0.2.42 does not render,
      # and `scripts/tests/test_no_two_owners.py` reddens.
      #
      # `0.2.36` OR LATER SPECIFICALLY, and an earlier parent is not
      # interchangeable. 0.2.36 is the first parent carrying all three hardened
      # `-db` charts — 0.2.34 carries one and 0.2.35 two — where hardened means
      # the MariaDB CR renders `helm.sh/resource-policy: keep`,
      # `argocd.argoproj.io/sync-options: Prune=false` and an OMITTABLE
      # `storage.className`. The values file's three `className: standard` lines
      # are meaningless against a parent without them. All three `-db` pins are
      # unchanged at `0.2.42`, so that property holds here too.
      targetRevision: 0.2.42
      helm:
        valueFiles:
          - $self/infra/yadgar/values.yaml
    - repoURL: https://github.com/yadgarhq/deploy
      targetRevision: main
      ref: self
  destination:
    server: https://kubernetes.default.svc
    namespace: yadgar
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]

  # MOVED VERBATIM FROM `infra/databases-app.yaml`, WHICH MERGE A DELETED.
  #
  # The operator writes the generated credential's name back onto the spec it
  # reconciles. Argo sees its own manifest differ from the live object and
  # reports OutOfSync forever, then selfHeal reverts it — a sync loop that
  # looks like drift and is actually the operator doing its job.
  #
  # ONE ENTRY COVERS ALL THREE DATABASES. Argo selects `ignoreDifferences` by
  # group and kind with `name` optional, so naming none of the three is what
  # makes it hold for each of them. This is the same block the chart's own
  # `example/application.yaml` carries from 0.2.37 — the adopter path and this
  # organisation's path agree on it rather than diverging.
  ignoreDifferences:
    - group: k8s.mariadb.com
      kind: MariaDB
      jsonPointers:
        - /spec/rootPasswordSecretKeyRef/generate
        - /spec/passwordSecretKeyRef/generate
