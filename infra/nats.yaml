# JetStream. Asynchronous work and events ONLY — the write path (D11, D39) and
# the audit outbox relay (D25). Synchronous reads stay on gRPC: running them
# over a broker is RPC reimplemented on a message bus, with two hops instead of
# one, no deadline propagation and degraded tracing (D22).
#
# Licence verified Apache-2.0. Residual vendor risk noted in the record: the
# core maintainers' employer attempted a BUSL relicence in 2025 and the May 2025
# settlement moved trademarks to the Linux Foundation with the code unchanged.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nats
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: default
  source:
    repoURL: https://nats-io.github.io/k8s/helm/charts
    chart: nats
    targetRevision: 2.14.6
    helm:
      values: |
        # nats-box is a shell with the NATS CLI in it — a debugging convenience,
        # not part of the system. `kubectl run` covers the same need on the rare
        # occasion it arises, without a pod running permanently to provide it.
        natsBox:
          enabled: false

        # ── Authentication (ledger 518) ──────────────────────────────────────
        # Until this landed the broker accepted a connection from ANYTHING ON THE
        # POD NETWORK, with no NetworkPolicy behind it either. That made D72's
        # cache invalidation events forgeable — publish a revocation for
        # somebody, or drown the real ones under a flood — and D25's audit outbox
        # INJECTABLE, which is worse: D25's own argument is that an audit log with
        # silent holes is worse than none because it will be trusted, and a
        # forgeable one is worse still.
        #
        # ONE ACCOUNT, because there is exactly one publisher TODAY. Measured
        # rather than recalled: `async-nats` appears in exactly one Cargo.toml in
        # the organisation, `iam`'s, which publishes from `invalidate.rs`.
        #
        # THE HEADER OF THIS FILE DESCRIBES MORE THAN THAT, and the difference is
        # the thing to notice. It names the write path (D11, D39) and D25's audit
        # outbox relay, which are what this broker is FOR — none of them is built
        # yet. Each one that arrives needs an account added here, and it will
        # arrive as a service that cannot connect rather than as a service that
        # connects anonymously, which is the failure mode worth having.
        #
        # Add accounts rather than sharing this one: a shared account cannot have
        # any single service's access revoked.
        #
        # `<< >>` IS THE CHART'S ESCAPE, NOT NATS SYNTAX. The chart emits this
        # config as JSON and quotes every scalar; a value wrapped in `<< >>` is
        # emitted UNQUOTED, which is what makes `$NATS_PASSWORD` a variable the
        # server expands rather than a literal fourteen-character password.
        # Verified by rendering the chart before committing: the output is
        # `"password": $NATS_PASSWORD`, with no quotes around it.
        #
        # THE SECRET IS NOT IN GIT, and it is not minted by a human either.
        # `infra/bootstrap/` generates it on first sync at wave -12, two waves
        # before this chart, and never touches it again — the same shape as the
        # Valkey password, both now created by the deployment rather than asked
        # for (ADR-0517). NOT the same shape as `iam-keys`, which is still
        # minted by hand on purpose: losing this password costs a rotation,
        # losing those keys costs the data. A missing Secret would still leave
        # this StatefulSet's pod in ContainerCreating, but the failure surfaces
        # earlier: the bootstrap Job fails at wave -12 and stops every later
        # wave.
        #
        # THE MONITORING PORT IS UNAFFECTED, and that was checked rather than
        # assumed. `config.monitor` serves plain HTTP on 8222 with no client
        # authorization, so the chart's own startup, readiness and liveness probes
        # keep working — an authorization block that broke them would take the
        # broker down rather than secure it.
        config:
          merge:
            authorization:
              users:
                - user: iam
                  password: << $NATS_PASSWORD >>

        container:
          env:
            # A FILE would be better and this chart offers no way to ask for one:
            # `container.env` is where it accepts a `secretKeyRef`, and the config
            # above references an environment variable by name. So the password is
            # in this container's environment. It is still out of git, out of this
            # manifest and out of any repository — and this pod is the one that
            # legitimately holds the credential, unlike its clients.
            NATS_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: nats-auth
                  key: password
  destination:
    server: https://kubernetes.default.svc
    namespace: yadgar
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
