# Prometheus, and it is here for ONE reason: D68's autoscaler needs somewhere to
# read D67's metrics from. KEDA's prometheus scaler queries a server; the services
# expose /metrics and nothing was scraping them.
#
# SERVER ONLY. No alertmanager, no pushgateway, no node-exporter, no kube-state.
# A development cluster does not need paging, and every extra component is one
# more thing to keep healthy for no current purpose. They can be enabled the day
# something wants them (D55: the environment is prod-like in the ways that expose
# defects, not in every way).
#
# Licence and supply chain verified before adoption, per O10: Apache-2.0 from the
# repository's own LICENSE, CNCF graduated, image pullable by exact tag from
# quay.io.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
  annotations:
    # Before the modules, which is what it scrapes — but after the operators, so
    # it is not competing for the first wave.
    argocd.argoproj.io/sync-wave: "-8"
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus
    targetRevision: 29.27.0
    helm:
      values: |
        alertmanager:
          enabled: false
        prometheus-pushgateway:
          enabled: false
        prometheus-node-exporter:
          enabled: false
        kube-state-metrics:
          enabled: false
        server:
          # Development sizing (D55): the ceiling here is the ~19 database
          # instances, not the observability stack.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
          persistentVolume:
            size: 2Gi
          # A short window on purpose. This exists to drive an autoscaler and to
          # answer "what did that call cost", not to be a long-term store — D67
          # sends the wide events elsewhere for that.
          retention: 24h
        # NO custom scrape_configs, deliberately. The chart already ships a
        # `kubernetes-pods` job doing annotation-based discovery, and adding one
        # of my own scraped every pod TWICE — two targets, two series per pod.
        #
        # The per-replica query survived that by accident (numerator and
        # denominator both doubled), which is the worst kind of correct: any
        # query that does not divide — a raw rate on a dashboard — would have
        # read 2x and nothing would have said so.
        #
        # Found by checking the target list rather than trusting `up == 1`.
        #
        # ALERTING RULES — the first consumer any yadgar metric has ever had.
        #
        # WHY HERE AND NOT IN A MODULE CHART. A `PrometheusRule` is not
        # reconcilable in this estate at all: there is no Prometheus Operator,
        # no `monitoring.coreos.com` CRD and no `ServiceMonitor` anywhere
        # (verified 2026-09-05 against the cluster's own CRD list, and against
        # `deploy` by grep). A module chart emitting that CRD would also be a
        # chart an adopter cannot install without a CRD they did not choose,
        # which D80 forbids in as many words. So the rules live on the
        # reference deployment's own Prometheus, where being opinionated is
        # the point rather than a leak.
        #
        # STILL NO ALERTMANAGER, and that is a decision rather than an
        # omission. Nothing in `deploy` or `argocd` holds an SMTP relay, a
        # Slack webhook, a PagerDuty routing key or any other receiver —
        # checked, not assumed. Enabling it would add a Deployment, a PVC and
        # an Argo health check in order to route every alert to the chart's
        # default null receiver: a component whose green means nothing, and
        # which makes the estate LOOK like it pages. That is the exact
        # confusion this change exists to remove, so it is refused. The
        # sentence above still holds — they can be enabled the day something
        # wants them.
        #
        # WHAT A RULE WITH NO RECEIVER BUYS, since it is less than a page and
        # more than nothing. The predicate stops being prose in a library's doc
        # comment and becomes a reviewed, diffable, `promtool`-checkable
        # expression that this repository owns. Prometheus evaluates alerting
        # rules whether or not any alertmanager is configured, so `ALERTS` and
        # `ALERTS_FOR_STATE` become queryable series and `/alerts` shows the
        # state. A metric is a capability and not yet a signal; a rule with no
        # receiver is a reviewed predicate and not yet a page. Each is one
        # honest step, and neither should be described as the next one.
        #
        # ABSENCE IS NEVER READ AS ZERO. Every rule below is a comparison on a
        # series that must EXIST to match, so a metric no pod publishes fires
        # nothing. There are deliberately NO `absent()` companions, and the
        # reason has MOVED since this was first written. It used to be that
        # only one `yadgar_*` name existed, so any `absent()` would fire at
        # once and be silenced within a day. Measured 2026-09-05 the store
        # holds THREE — `yadgar_dial_upstream_never_resolved`,
        # `yadgar_rotation_watched_files_unreadable` and
        # `yadgar_tls_certificate_not_after_seconds`, one per rule below — so
        # an `absent()` on any of those names would now fire never, which is
        # just as useless. Every real gap here is a missing LABEL VALUE inside
        # a name that is present: no `upstream="iam"`, no `service="iam-db"`.
        # `absent()` cannot see that unless the rule NAMES the value it
        # expects, and nothing has declared which series must exist. The limit
        # that buys is stated rather than hidden — a `> 0` rule cannot notice
        # its own reporter going away, and no rule here can, until a series'
        # presence is itself a deployment invariant somebody declared.
        serverFiles:
          alerting_rules.yml:
            groups:
              - name: yadgar
                rules:
                  # ADR-0532's lazy dial traded operator legibility for client
                  # legibility. A service whose upstream is absent used to show
                  # as CrashLoopBackOff with climbing restarts and a Degraded
                  # Argo Application; it now shows 1/1 Running and Argo
                  # Healthy, with nothing anywhere saying it is broken. The
                  # replacement offered was an ERROR log line per refresh tick,
                  # and this namespace runs a Prometheus server and NO log
                  # shipper — no promtail, loki, fluent-bit or vector — so that
                  # line reaches `kubectl logs` and an operator who has already
                  # guessed the answer. This is the rule the gauge was shaped
                  # for, and it is the reason the gauge exists.
                  #
                  # LIVE, AND COVERING THREE HOPS OF FOUR. `gateway`, `iam`
                  # and `task` now pin `yadgar-dial` at v0.2.1, which is the
                  # tag the gauge arrived in. Measured against this store on
                  # 2026-09-05, `yadgar_dial_upstream_never_resolved` carries
                  # exactly three `upstream` values — `task` from `gateway`,
                  # `iam-db` from `iam`, `task-db` from `task` — two series
                  # each, one per replica.
                  #
                  # THE HOP IT DOES NOT COVER IS `gateway` -> `iam`, and that
                  # is the one carrying every login, enrolment and attestation.
                  # `gateway::upstream::connect_iam` does not go through
                  # `yadgar_dial` at all: it builds its own `Endpoint` and
                  # calls `connect_lazy` on it, because ADR-0514 requires the
                  # URI scheme and the TLS configuration to be decided in ONE
                  # expression and `yadgar_dial` decides the scheme itself.
                  # The gauge is written from INSIDE `dial`, so the hop that
                  # bypasses `dial` publishes nothing. No `upstream="iam"`
                  # series exists for this rule to match.
                  #
                  # SO A DEAD `gateway` -> `iam` STILL LOOKS HEALTHY, which is
                  # the exact condition ADR-0532 created and this rule was
                  # written to end. Closing it means routing `connect_iam`
                  # through `dial` without breaking ADR-0514, or publishing the
                  # gauge from `gateway` itself. Either is its own change and
                  # neither is a threshold to tune here. Until one lands, read
                  # a quiet rule as "three hops are fine", never "all four".
                  #
                  # NO `by (upstream)` AGGREGATION, on purpose. An alerting
                  # rule has no `by` clause; the expression's OUTPUT LABELS are
                  # what fires and what an annotation can name. This form keeps
                  # `upstream` and `pod` and `namespace`, so one alert names
                  # both the absent upstream and which replica cannot reach it.
                  # `max by (upstream) (...)` reads closer to the English and
                  # throws the pod away.
                  - alert: DialUpstreamNeverResolved
                    expr: max_over_time(yadgar_dial_upstream_never_resolved[5m]) > 0
                    for: 2m
                    labels:
                      severity: critical
                    annotations:
                      summary: >-
                        {{ $labels.pod }} has never resolved its upstream
                        {{ $labels.upstream }}
                      description: >-
                        The process is running and reports Ready, and no
                        address for {{ $labels.upstream }} has EVER been given
                        to its balancer since boot — so every call through that
                        seam fails. This is not a transient blip: the value
                        is a LATCH rather than a sample, so a 1 says no address
                        has arrived since boot, not that one lookup just
                        failed. Check that the upstream's Service and pods
                        exist in {{ $labels.namespace }}.
                  # A file the deployment NAMED and the process could not read.
                  # Rotation of that file cannot be noticed, so the pod will
                  # keep serving material it can no longer see change.
                  #
                  # `for: 10m` IS SIZED AGAINST THE POLL, not picked. The
                  # charts set `tlsRotation.pollSeconds: 60` and the library's
                  # own default is 60s, and the code is explicit that a file
                  # unreadable at this instant is the transient state kubelet
                  # passes through while it rewrites a mount. Roughly ten polls
                  # have to agree before this fires; one mount rewrite cannot.
                  #
                  # Absence here means a pod with an EMPTY watch set, one
                  # that has not finished its first poll — the gauge is
                  # published only inside the loop — or a pod with NO WATCHER
                  # AT ALL, which is the cause this used to leave out.
                  # Measured 2026-09-05, this series carries `service` values
                  # `gateway`, `iam` and `task`, and neither `-db`. `iam-db`
                  # and `task-db` take `yadgar-lifecycle` with
                  # `default-features = false`, which compiles out the whole
                  # `rotate` module — and that module owns this gauge AND the
                  # expiry gauge the rule below wants. So both rules are dark
                  # on the same two pods for the same one manifest line.
                  # Absence does not mean zero, and `> 0` is the shape that
                  # respects the difference.
                  - alert: RotationWatchedFilesUnreadable
                    expr: yadgar_rotation_watched_files_unreadable > 0
                    for: 10m
                    labels:
                      severity: warning
                    annotations:
                      summary: >-
                        {{ $labels.service }} cannot read
                        {{ $value }} of its watched files
                      description: >-
                        A path this deployment told {{ $labels.service }} to
                        watch has been unreadable for ten consecutive polls, so
                        it is a configuration defect rather than a mount being
                        rewritten. Rotation of those files cannot be noticed
                        while this holds, and the pod goes on presenting
                        whatever it loaded at boot. The pod is
                        {{ $labels.pod }}; the log line at boot names the paths.
                  # THE ONLY RULE HERE THAT CAN FIRE TODAY.
                  # `yadgar_tls_certificate_not_after_seconds` is the one
                  # `yadgar_*` series this Prometheus currently holds — `iam`
                  # and `task` both publish it, `kind="serving"`.
                  #
                  # FOURTEEN DAYS, ARITHMETIC RATHER THAN TASTE. All eight
                  # LEAF certificates this repository declares — four serving
                  # and three client under `infra/internal-tls/`, plus the edge
                  # leaf in `infra/tls/` — set `duration: 2160h` (90d). Their
                  # `renewBefore` values are NO LONGER ALL 720h: the seven
                  # under `infra/internal-tls/` climb a 6-hour ladder from 726h
                  # to 762h so that no two services renew in the same window,
                  # which is argued at length in `certificates.yaml`. The edge
                  # leaf keeps 720h.
                  #
                  # THE THRESHOLD IS SIZED AGAINST THE SMALLEST OF THEM, and
                  # the ladder only ever moves a renewal EARLIER, so the floor
                  # is the edge leaf's 720h: cert-manager rewrites every Secret
                  # here with AT LEAST 30 days left. Firing at 14 therefore
                  # still means sixteen days of renewal-or-reload having failed
                  # before anyone is told, and fourteen days of runway after.
                  # It is a BACKSTOP behind cert-manager rather than the first
                  # line, and it sits far enough below every `renewBefore` here
                  # that a normal renewal cannot trip it.
                  #
                  # THIS RULE COVERS TWO CERTIFICATES OF NINE, and naming
                  # the other seven is the honest half of drawing this
                  # boundary. Measured 2026-09-05 against this store,
                  # `yadgar_tls_certificate_not_after_seconds` carries
                  # `service="iam"` and `service="task"` at `kind="serving"`
                  # and nothing else. The gaps have TWO different causes that
                  # need two different fixes, so they are not flattened into
                  # one sentence.
                  #
                  # PRESENTED, BUT THE EXPORTER IS COMPILED OUT — `iam-db-tls`
                  # and `task-db-tls`, two of the four serving leaves under
                  # `infra/internal-tls/`. Both pods serve TLS
                  # (`LISTEN_TLS_ENABLED=1`) and both are scraped (`up` is 1),
                  # so this is a missing SERIES and not a missing target,
                  # which is the shape no `up`-based rule can see. `iam-db`
                  # and `task-db` take `yadgar-lifecycle` with
                  # `default-features = false`, and that crate gates its whole
                  # `rotate` module — the module that owns this gauge — on the
                  # feature `default` would have enabled. The fix is one
                  # manifest line in each of those two repositories.
                  #
                  # NOTHING PRESENTS THE OTHER FIVE, so they can never appear
                  # here at all. The internal root is `duration: 87600h` with
                  # `renewBefore: 8760h` (`infra/internal-tls/issuer.yaml`),
                  # the one certificate on a different clock. `gateway-tls` is
                  # served by the edge Gateway's listener rather than by any
                  # yadgar process. `gateway-client-tls`, `iam-client-tls` and
                  # `task-client-tls` are issued and mounted into no pod —
                  # checked against the live volumes, not inferred.
                  #
                  # SO A QUIET RULE HERE MEANS `iam` AND `task` ARE FINE. It
                  # says nothing about the other seven. It is still worth
                  # landing, for the reason below.
                  #
                  # It measures what the PROCESS loaded, which is the gap
                  # cert-manager's own metrics cannot see: cert-manager knows
                  # what it issued, this knows what is being presented. The
                  # value is exported once at boot and that is correct by
                  # construction — a material change makes the rotation watcher
                  # drain and exit 0, so the process restarts onto the new
                  # certificate and re-exports.
                  #
                  # An already-expired certificate satisfies this too, since
                  # the difference goes negative. That is the worse state and
                  # the same action, so it is not split into a second rule.
                  #
                  # NO `for:` HERE, and it is the one rule in this group
                  # without one. The other two watch a value that moves, so a
                  # pending window is what separates a condition from a blip.
                  # This value is exported ONCE, at boot, and then never
                  # changes for the life of the process — there is nothing to
                  # flap, so a single scrape is already the whole signal. A
                  # pending window would only delay the alert past a restart,
                  # and worse, a pod restarting more often than that window
                  # would reset the timer every time and never fire. A rule a
                  # restart loop can silence is the failure this whole file
                  # exists to correct.
                  - alert: TlsCertificateExpiringSoon
                    expr: yadgar_tls_certificate_not_after_seconds - time() < 14 * 24 * 3600
                    labels:
                      severity: warning
                    annotations:
                      summary: >-
                        {{ $labels.service }}'s {{ $labels.kind }} certificate
                        expires in under 14 days
                      description: >-
                        The certificate {{ $labels.pod }} actually loaded
                        expires at {{ $value }} seconds from now. cert-manager
                        renews these at 30 days remaining, so reaching 14 means
                        either the renewal or the pod's reload has been failing
                        for about a fortnight. Check the Certificate resource
                        and whether the pod restarted after the Secret was
                        rewritten.
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
