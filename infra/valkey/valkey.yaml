# The one shared cache (D21): a single Valkey deployment, with each -db service
# using its own key namespace. Holds the row and query caches D17 places inside
# each twin, the epoch counters that replace D18's in-process bus, conversation
# tokens (D29), throttle counters (D46) and the debounced last_seen_at of D52.
#
# NOT a cache service fronting the databases — D21 rejects that explicitly. Each
# -db owns its own invalidation because under D4 it is the only single writer
# able to do it correctly.
#
# ── Why a hand-written manifest instead of a chart ──────────────────────────
# The Bitnami chart was used first and removed. Bitnami restricted free image
# distribution in 2025, and the consequence is not theoretical — verified
# 2026-08-30 with skopeo:
#
#   bitnami/valkey:9.1.1   NOT PULLABLE
#   bitnami/valkey:8.1     NOT PULLABLE
#   bitnami/valkey:latest  the only tag that resolves
#
# So the chart pins to 6.2.13 while its image is `:latest`. PINNING IS NOT
# POSSIBLE THERE, only unpinning. A rebuild months from now silently gets a
# different Valkey. Overriding the image to the official one does not work
# either: the chart's entrypoint expects Bitnami's /opt/bitnami layout.
#
# The official image pins cleanly and what D21 actually asks for is one
# deployment, so a chart was buying configuration nobody needed at the cost of a
# supply chain nobody controls.
#
# ── Why no persistence, and no replicas ────────────────────────────────────
# NOTHING HERE SURVIVES LOSS BECAUSE NOTHING HERE NEEDS TO. Compute caches are
# content-addressed, so a stale entry is impossible by construction (D17). Row
# caches key on D8's version and query caches on an epoch, so both recompute.
# D29 already requires an evicted conversation token to degrade to a new
# conversation and SAY SO. Losing this cache costs a cold start, not data —
# which is why it is a Deployment with no volume rather than a StatefulSet with
# a PVC, and one instance rather than four.
apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: yadgar
  labels: { app.kubernetes.io/name: valkey }
spec:
  selector: { app.kubernetes.io/name: valkey }
  ports:
    - name: valkey
      port: 6379
      targetPort: valkey
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  namespace: yadgar
  labels: { app.kubernetes.io/name: valkey }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: valkey }
  template:
    metadata:
      labels: { app.kubernetes.io/name: valkey }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: valkey
          # Official upstream image, pinned. The whole reason this is not a
          # chart.
          image: valkey/valkey:9.1.1
          imagePullPolicy: IfNotPresent
          # ── A SHELL, and it is the only way to get the password in ──────────
          # Container `args` are NOT shell-expanded, and the official image's
          # entrypoint execs `valkey-server "$@"` without evaluating anything, so
          # `--requirepass $VALKEY_PASSWORD` as a bare argument would set the
          # password to the sixteen literal characters of that string.
          # Kubernetes' own `$(VAR)` expansion does apply to `command` and
          # `args` — but it expands into the PodSpec's rendered command, which is
          # exactly where this change exists to keep the password out of.
          #
          # `exec` so valkey-server is PID 1 and receives SIGTERM directly.
          # Without it the shell is PID 1, the signal never reaches the server,
          # and every rollout waits out the whole termination grace period.
          #
          # THE RESIDUAL, stated rather than left to be found: the password is
          # visible in `/proc/1/cmdline` inside this container. It is not in this
          # manifest, not in `kubectl describe pod`, and not in git — which are
          # the three places it would otherwise reach somebody who is not already
          # inside the container.
          command: ["sh", "-c"]
          args:
            # A cache that refuses writes when full is not a cache. Eviction is
            # the correct behaviour for every class of entry stored here, all of
            # which are recomputable.
            - |
              exec valkey-server \
                --requirepass "$VALKEY_PASSWORD" \
                --maxmemory 512mb \
                --maxmemory-policy allkeys-lru \
                --save "" \
                --appendonly no
          env:
            # ── requirepass (ledger 518) ────────────────────────────────────
            # Until this landed ANYTHING ON THE POD NETWORK could read and
            # rewrite everything in here: D74's token buckets (reset one to grant
            # unlimited capacity, or empty one to throttle a named person), D18's
            # epoch counters, D29's conversation tokens and D46's throttle
            # counters. There was no NetworkPolicy either, and on the reference
            # CNI there could not usefully be one — see infra/network-policies/.
            #
            # `requirepass` is enforced by the SERVER, so it holds on every CNI
            # and on every platform, which is also what D80 asks for. That is why
            # it leads and the NetworkPolicy follows rather than the reverse.
            #
            # THE SECRET IS NOT IN GIT, and it is not minted by a human either.
            # `infra/bootstrap/` generates it on first sync at wave -12, two
            # waves before this Deployment, and never touches it again — the
            # same effect MariaDB's `generate: true` has for the database
            # passwords, which there is no operator here to provide (ADR-0517).
            # Nobody reads this password; losing it costs a rotation.
            #
            # A missing Secret would still leave this pod in ContainerCreating,
            # but that is no longer where the failure surfaces: the bootstrap
            # Job fails at wave -12 and stops every later wave, which is the
            # loud failure and the right one.
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: valkey-password
                  key: password
            # THE PROBE'S COPY, under the name `valkey-cli` itself reads. A
            # probe's `exec.command` is NOT subject to Kubernetes' `$(VAR)`
            # expansion — that applies to `command` and `args` only — so the
            # credential reaches the probe either through the environment or on a
            # command line that runs every five seconds. This is the better of
            # the two.
            #
            # `VALKEYCLI_AUTH`, NOT `REDISCLI_AUTH`. Read off `valkey-cli --help`
            # in this exact image rather than assumed from Redis: the fork
            # renamed it, and the Redis name is silently ignored.
            - name: VALKEYCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: valkey-password
                  key: password
          ports:
            - name: valkey
              containerPort: 6379
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 640Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          livenessProbe:
            tcpSocket: { port: valkey }
            initialDelaySeconds: 5
          readinessProbe:
            # ── THE ANSWER IS CHECKED, NOT JUST THE EXIT CODE ────────────────
            # This used to be `["valkey-cli", "ping"]`, and it is grepped now
            # because of a MEASUREMENT rather than a preference. Against this
            # image with `requirepass` set and no credential available,
            # `valkey-cli ping` prints `NOAUTH Authentication required.` and
            # **exits 0**. So the bare form was a probe that could not fail on
            # the one thing this change makes possible to get wrong: it would
            # have reported a server nobody could talk to as Ready, and the
            # gateway's degraded-mode counter would have been the only evidence.
            #
            # With the grep, an unauthenticated probe exits 1 and this pod leaves
            # the Service. Both arms were run against the real image before this
            # was written: authenticated exits 0, unauthenticated exits 1.
            #
            # The `livenessProbe` above stays `tcpSocket`, deliberately. It asks
            # whether the port is open, which is a question `requirepass` does not
            # change — and a liveness probe that can fail on a credential would
            # restart a healthy server because a Secret was rotated wrong.
            exec:
              command: ["sh", "-c", "valkey-cli ping | grep -q PONG"]
            initialDelaySeconds: 2
            periodSeconds: 5
