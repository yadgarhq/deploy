# THIS ORGANISATION'S VALUES FOR THE PARENT CHART, READ BY infra/yadgar-app.yaml
# AS `$self/infra/yadgar/values.yaml`.
#
# ADR-0786: any divergence between this organisation's estate and an adopter's
# must be expressible as a difference between two values files, so it is a
# visible render diff rather than invisible drift. This file IS that difference.
# Nothing environment-specific belongs anywhere else.
#
# NOT READ BY THE `infra` APP-OF-APPS. It sources `path: infra` with no
# `directory.recurse`, so a file one directory down is invisible to it — the same
# reason `infra/databases/` holds manifests that only the `databases` Application
# reads. A values file directly in `infra/` would be applied as a manifest.
#
# DERIVED FROM EACH MODULE CHART'S OWN DEFAULTS, never copied from the
# `yadgar-modules` ApplicationSet's values block (ADR-0751, ADR-0619). Every key
# below turns ON something the chart ships OFF, so an omission PRUNES a live
# object rather than leaving it alone.
#
# MEASURED 2026-09-26 against the published `yadgar:0.2.38`, the version
# `infra/yadgar-app.yaml` pins rather than the newest published one (digest
# sha256:38847bbbdda01657f3a2d259c423e4c1c9e36a3310c8d7698c0b380ac18d3b32):
# this file renders 51 objects, three of them `MariaDB`. It rendered 48 and
# ZERO MariaDB until merge B of `plans/the-mariadb-crs-into-the-chart.md` set
# the three `database.create` toggles below true. The three rendered specs are
# identical to the three live CRs' last-applied specs — 0 differing fields over
# 3 instances, that plan's M2 gate — and each rendered object carries
# `helm.sh/resource-policy: keep` and
# `argocd.argoproj.io/sync-options: Prune=false`, which is M2a at 6 over 3.
#
# 64 OBJECTS AS OF STEP 5 of `plans/retiring-the-deploy-copies.md`, measured
# 2026-09-27 at the same pin and digest. `platform.internalCA.create` and
# `platform.certificates.create` below add exactly 13 — Certificate and Issuer
# `yadgar-internal-ca`, Issuer `yadgar-internal-selfsign` and the ten leaf
# Certificates — and change 0 lines in the other 51.
#
# 70 OBJECTS AS OF STEP 6's FIRST MERGE, measured 2026-09-27 at the same pin
# and digest. `platform.nats.create` below adds exactly 6 — `StatefulSet`,
# `Service`, `PodDisruptionBudget` `yadgar-nats`, `Service/yadgar-nats-headless`,
# `ConfigMap/yadgar-nats-config` and `NetworkPolicy/nats-ingress` — and changes
# 0 of the other 64. No Deployment changes, so no existing pod rolls.
#
# STILL 70 AS OF STEP 6's SECOND MERGE, measured 2026-09-27 at the same pin and
# digest. The two `nats.url` lines below change exactly 2 lines of the render —
# the `NATS_URL` value in `Deployment/iam` and in `Deployment/gateway` — and
# add or remove no object. Both Deployments roll.
#
# STILL 70 AS OF STEP 6's THIRD MERGE, byte-identical: that merge deletes
# `infra/nats.yaml` and does not touch this file.
#
# STILL 70 AS OF B5 of `plans/the-one-application-install.md`, measured
# 2026-09-27 against `yadgar:0.2.42` (digest sha256:5b092b8d…): the bump and
# this file's two deleted `nats.url` lines remove the five `yadgar-nats*`
# broker objects, add the same five as `nats*` with every other field equal,
# and move `NATS_URL` in `Deployment/iam` and `Deployment/gateway` to
# `nats://nats:4222`. The other 63 objects are byte-identical. Both
# Deployments roll.

# ── THE ESTATE'S HOSTNAME, STATED ONCE (ADR-0808) ────────────────────────────
# `platform` (the Gateway listener and the edge Certificate), `gateway` (the
# HTTPRoute) and `iam` (the enrolment URL) derive their hostnames from this key
# when their own keys are empty, which they are here. Empty, it renders the same
# `gateway.yadgar.internal` in all five places, so stating it changes no object:
# measured 2026-09-27 at the pinned 0.3.7. It is stated because it is THIS
# organisation's edge name, and it must agree with the root CA's nameConstraints.
global:
  hostname: gateway.yadgar.internal

# ── GATEWAY ──────────────────────────────────────────────────────────────────
# `tls.enabled` is gateway's OWN listener. `gateway.iam.tls.enabled` and its two
# siblings are DIALS — whether gateway speaks TLS TO that module. Two different
# questions on keys one character apart.
#
# `networkPolicy` IS THE EDGE'S INGRESS ALLOW-LIST, AS OF STEP 8 of
# `plans/retiring-the-deploy-copies.md` (ADR-0685's recorded alternative: a
# `from` supplied by values). The merge that set it deleted
# `infra/network-policies-app.yaml` and `infra/network-policies/gateway-ingress.yaml`,
# whose spec the chart now renders field for field under the same name; the
# chart adds only the label `app: gateway`. `deploy#70` put `Prune=false` on the
# copy one merge ahead, so the handover is an adoption.
#
# THE PEER IS DERIVED FROM THE GATEWAY'S NAME. Envoy Gateway stamps
# `owning-gateway-name`/`-namespace` from `Gateway/edge`, which `platform`
# renders from `platform.gatewayListener.gatewayName` (default `edge`) into
# this release's namespace. Rename either and this peer selects no pod: every
# external call times out while every pod stays Ready (ADR-0685). Change the
# two in one diff. The chart refuses an enabled policy with no `clients`,
# rather than rendering an allow-all.
gateway:
  autoscaling: { enabled: true }
  sourceAddress: { trustedProxyHops: "" }
  adminBootstrap: { tokenSecret: admin-bootstrap-token }
  tls: { enabled: true } # gateway's own listener
  gateway: { enabled: true } # the HTTPRoute
  iam: { tls: { enabled: true } } # DIAL to iam
  task: { tls: { enabled: true } } # DIAL to task
  project: { tls: { enabled: true } } # DIAL to project
  networkPolicy:
    enabled: true
    clients:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: envoy-gateway-system
        podSelector:
          matchLabels:
            app.kubernetes.io/name: envoy
            gateway.envoyproxy.io/owning-gateway-name: edge
            gateway.envoyproxy.io/owning-gateway-namespace: yadgar
    scrapeFrom: { namespace: observability }
  # NO `nats.url`, AS OF B5: the module default `nats://nats:4222` names the
  # parent's broker, which `platform` renders as `nats` from 0.1.15
  # (`fullnameOverride`, ADR-0805; parent 0.2.42 pins 0.1.17). See
  # `platform.nats` below.

# ── THE SIX SERVICES ─────────────────────────────────────────────────────────
# `scrapeFrom.namespace: observability` is where Prometheus runs; each module's
# `clients` list is the one service entitled to dial it.
iam:
  autoscaling: { enabled: true }
  tls: { enabled: true }
  iamDb: { tls: { enabled: true } }
  # THE ENROLMENT URL KEEPS ITS PORT, AND `global.hostname` ABOVE WOULD DROP
  # IT. With `global.hostname` set and this key empty, iam derives
  # `https://gateway.yadgar.internal` with NO port (ADR-0808: an edge on 443).
  # This cluster's edge is reached from the host on 18443 (kind's mapping to
  # node port 30443), and `ENROLMENT_GATEWAY` renders
  # `https://gateway.yadgar.internal:18443` today, from the chart's no-hostname
  # fallback. Stated here, so every enrolment token keeps the address a client
  # can reach. Measured 2026-09-27 at the pinned 0.3.7: without this line,
  # `global.hostname` changes exactly this one env value and rolls `iam`.
  enrolment: { gateway: "https://gateway.yadgar.internal:18443" }
  # NO `nats.url`, AS OF B5; see `gateway` above.
  networkPolicy:
    {
      enabled: true,
      clients: [gateway],
      scrapeFrom: { namespace: observability },
    }

iam-db:
  autoscaling: { enabled: true }
  tls: { enabled: true }
  networkPolicy:
    { enabled: true, clients: [iam], scrapeFrom: { namespace: observability } }
  # `create: true` IS MERGE B OF `plans/the-mariadb-crs-into-the-chart.md`, and
  # it is the flip the `className` line below was written for. Merge A deleted
  # `infra/databases-app.yaml` one merge earlier, so `iam-db-mariadb` is live
  # and owned by NOBODY at this point; this line is what makes the `yadgar`
  # Application render it and adopt it by rewriting one annotation. The apply
  # touches no spec field — the rendered spec equals the live last-applied spec
  # on every field, which is the plan's M2 gate and is what the pre-merge render
  # measures.
  #
  # THE `className` LINE IS WHAT MAKES THAT ADOPTION POSSIBLE RATHER THAN
  # REFUSED. `spec.storage.storageClassName` carries `webhook:"inmutable"` on
  # mariadb-operator 26.6.0, and the operator's `inmutable_webhook.go` compares
  # old and new with `reflect.DeepEqual` — so REMOVING a set field is a change
  # and is REFUSED.
  #
  # The chart's shipped default is EMPTY on purpose, because `standard` is kind's
  # local-path class and on any other cluster it leaves the PVC `Pending`
  # forever with nothing refusing. Empty renders NO `storageClassName` field, so
  # the target cluster's own default class binds.
  #
  # This cluster's three live CRs carry `standard`. Measured 2026-09-26 on
  # `yadgar:0.2.36`: WITHOUT these three lines the render omits the field on all
  # three instances and the adoption apply asks the webhook to unset it. WITH
  # them, 3 of 3 carry `storageClassName: standard` and the rendered spec differs
  # from the live last-applied spec in 0 fields.
  database:
    create: true
    instance:
      storage:
        className: standard

task:
  autoscaling: { enabled: true }
  tls: { enabled: true }
  taskDb: { tls: { enabled: true } }
  networkPolicy:
    {
      enabled: true,
      clients: [gateway],
      scrapeFrom: { namespace: observability },
    }

task-db:
  autoscaling: { enabled: true }
  tls: { enabled: true }
  networkPolicy:
    { enabled: true, clients: [task], scrapeFrom: { namespace: observability } }
  # See `iam-db.database` above for why both lines exist, what `create: true`
  # adopts, and what refuses the apply without the `className`.
  database:
    create: true
    instance:
      storage:
        className: standard

project:
  autoscaling: { enabled: true }
  tls: { enabled: true }
  projectDb: { tls: { enabled: true } }
  networkPolicy:
    {
      enabled: true,
      clients: [gateway],
      scrapeFrom: { namespace: observability },
    }

project-db:
  autoscaling: { enabled: true }
  tls: { enabled: true }
  networkPolicy:
    {
      enabled: true,
      clients: [project],
      scrapeFrom: { namespace: observability },
    }
  # See `iam-db.database` above for why both lines exist, what `create: true`
  # adopts, and what refuses the apply without the `className`.
  database:
    create: true
    instance:
      storage:
        className: standard

# ── THE PLATFORM LAYER, COMING ON ONE OBJECT AT A TIME ───────────────────────
# EVERY `false` BELOW MARKS SOMETHING `deploy` STILL OWNS, and each one is moved
# by the step of `plans/retiring-the-deploy-copies.md` that deletes the copy.
# The plan's ordering is not a preference: every Application in `infra/` carries
# `prune: true` and `selfHeal: true`, so a toggle flipped while its copy still
# exists is two automated Applications pruning each other's objects. The deletion
# and the flip are ONE merge, which makes that interval empty rather than short.
# `scripts/tests/test_no_two_owners.py` is the gate that refuses the other order.
#
# THE CONVERSE DOES NOT HOLD, and reading it that way is a trap. A toggle that is
# `true` does not mean `deploy` owns nothing — after the last step `deploy` still
# owns five objects no parent toggle can render, and `preflight.enabled` is false
# for a reason that has nothing to do with ownership.
#
# THE FALSES ARE STATED RATHER THAN INHERITED. They are also the chart's own
# defaults; writing them here means a render this organisation measures is
# reproducible from this file alone, and a later parent changing a default cannot
# change this estate. `platform.enabled` true is what makes every one of them
# load-bearing — until this step they were unreachable behind the dependency
# `condition`, which is why they are written now rather than earlier.
#
# `platform.enabled: true` ADDS NO OBJECT BY ITSELF. Measured 2026-09-26 against
# the pinned `yadgar:0.2.36`: this file renders 45 tuples, and this file with
# `--set platform.enabled=true` renders the same 45. The two `valkey` keys below
# take it to 48, and the three added are exactly `Deployment/valkey`,
# `Service/valkey` and `NetworkPolicy/valkey-ingress`. That render carries ZERO
# hook-annotated objects, which is what keeps `preflight` off the live estate's
# sync at this step.
platform:
  enabled: true

  # ── VALKEY: THE PARENT'S, AS OF STEP 3 ─────────────────────────────────────
  # `infra/valkey-app.yaml`, `infra/valkey/` and the `valkey-ingress` half of
  # `infra/network-policies/shared-infrastructure.yaml` were deleted in the merge
  # that set this true.
  valkey:
    create: true

  # ── THE INTERNAL CA AND ITS TEN LEAVES: THE PARENT'S, AS OF STEP 5 ─────────
  # `infra/internal-tls-app.yaml` and `infra/internal-tls/` were deleted in the
  # merge that set these two true. The 13 rendered specs equal the 13 live
  # specs field for field, measured 2026-09-27 against `kind-yadgar`, so the
  # handover rewrites the tracking-id and reissues nothing: the CA Secret and
  # the ten leaf Secrets keep their names, and cert-manager here runs without
  # `--enable-certificate-owner-ref`, so no Secret is owned by a Certificate.
  internalCA:
    create: true
  certificates:
    create: true

  # ── A SECOND BROKER, BESIDE `deploy`'S, AS OF STEP 6's FIRST MERGE ─────────
  # Step 6 runs as THREE merges: stand this broker up, move the clients to it,
  # then delete `infra/nats.yaml`. This is the first. The copy deleted in the
  # same merge is `infra/network-policies/nats-ingress.yaml`, because
  # `nats-ingress` is the one object this toggle renders that `deploy` also
  # held; the rendered spec equals that file's spec field for field. The other
  # five objects are named `yadgar-nats*` after this release and collide with
  # nothing, so `infra/nats.yaml`'s broker keeps running. Both brokers read
  # `nats-auth` and `nats-auth-gateway`, which `infra/bootstrap/` mints, so
  # this one starts with working accounts.
  #
  # THE SECOND MERGE MOVED BOTH CLIENTS HERE: `gateway.nats.url` and
  # `iam.nats.url` above read `nats://yadgar-nats:4222`, where the module
  # default `nats://nats:4222` dials `deploy`'s broker. The two brokers are not
  # clustered, so during that merge's roll an `iam` pod and a `gateway` pod can
  # sit on different brokers and an invalidation crosses nothing; gateway's
  # credential cache TTL (`YADGAR_CREDENTIAL_TTL_SECONDS`, 30 here) bounds the
  # stale answer. `infra/nats.yaml` stayed until the third merge, so a revert of
  # the second found the old broker still serving.
  #
  # THE THIRD MERGE DELETED `infra/nats.yaml`, SO THIS IS NOW THE ONLY BROKER
  # ANY APPLICATION RENDERS. No Application carries a finalizer, so the delete
  # ORPHANED `deploy`'s five objects (`StatefulSet`, `Service`,
  # `PodDisruptionBudget` `nats`, `Service/nats-headless`,
  # `ConfigMap/nats-config`) rather than deleting them; nothing dials them.
  # B4b in MIGRATION_NOTES.md deletes them by hand before B5.
  #
  # B5 RENAMES THIS BROKER TO `nats` BY DELETE-THEN-ADOPT. Parent 0.2.42's
  # `platform` carries `fullnameOverride: nats`, so the sync prunes the five
  # `yadgar-nats*` objects and creates the same five as `nats*`, the names
  # both clients' module default dials.
  nats:
    create: true

  # ── THE EDGE: THE PARENT'S, AS OF STEP 7 ───────────────────────────────────
  # `infra/tls/{certificate,envoyproxy,gatewayclass,gateway}.yaml` were deleted
  # in the merge that set these two true. `infra/tls-app.yaml` SURVIVES with
  # `ca-preflight.yaml` and `clusterissuer.yaml`: the parent renders neither
  # the preflight nor `ClusterIssuer/yadgar-dev-ca`. `deploy#68` put
  # `Prune=false` on the four copies one merge ahead, so the handover rewrites
  # the tracking-id on the same four objects. The four rendered objects equal
  # the deleted copies field for field (ignoring namespace and that
  # annotation), measured 2026-09-27 at the pinned 0.3.7 and asserted by
  # `scripts/tests/test_no_two_owners.py`.
  edgeTLS:
    create: true
    # EXPLICIT, AND LOAD-BEARING. Left empty with `internalCA.create` true,
    # the chart signs the edge leaf with its internal CA — a root no client
    # trusts — and cert-manager reissues `gateway-tls` on the handover. The
    # ClusterIssuer is `deploy`'s own (`infra/tls/clusterissuer.yaml`).
    issuerRef:
      name: yadgar-dev-ca
      kind: ClusterIssuer
  gatewayListener:
    create: true
    envoyProxy:
      # THIS CLUSTER'S EDGE, NOT THE ADOPTER'S (ADR-0809). Under rootless
      # podman the host cannot route to container IPs, so there is no
      # LoadBalancer here: kind maps host 18443 to node port 30443 on the
      # control-plane node only (`modules/nixos/kind.nix` in the nix repo is
      # the other half), and the Envoy Service's `externalTrafficPolicy` is
      # `Local`. So the data plane must run on that node, and the nodePort is
      # pinned. An unpinned nodePort is allocated at random, and a proxy on a
      # worker leaves the mapped port with no local endpoint.
      serviceType: NodePort
      httpsNodePort: 30443
      pod:
        nodeSelector:
          node-role.kubernetes.io/control-plane: ""
        tolerations:
          - key: node-role.kubernetes.io/control-plane
            operator: Exists
            effect: NoSchedule

  # ── STILL `deploy`'S ───────────────────────────────────────────────────────
  # Each line names the step that moves it and the copy that has to go first.
  # Step 9 runs as TWO merges with hand step A5b between (ADR-0810). The
  # first deleted `infra/bootstrap/`; the second turns `create` on.
  bootstrap:
    create: false # step 9's second merge, after A5b
    iamKeys:
      create: false # step 9, and the Secret it mints is unrecoverable

  # THE OPERATORS RELEASE IS NOT THIS ORGANISATION'S PATH (ADR-0787). `infra/`
  # installs cert-manager, KEDA, mariadb-operator, Envoy Gateway and Argo CD as
  # Applications of their own, and no step of the retirement plan moves them.
  operators:
    create: false

  # NOT IN THE RETIREMENT PLAN'S SCOPE, and off for a different reason from every
  # toggle above: cost per sync, not ownership. It defaults TRUE in the chart —
  # the one exception to that chart's default-false convention — so leaving it
  # unstated would turn three PreSync hook Jobs on for this estate the moment a
  # `platform.*.create` above resolves a probe. Measured 2026-09-26 on
  # `platform` 0.1.12: the cert-manager and KEDA arms of `preflight`, and the
  # whole post-install `envoy-gateway-probe`, FAIL on a healthy cluster. Their
  # `condition_matches` parses the API server's answer as compact JSON, and the
  # API server pretty-prints for any client whose `User-Agent` begins with
  # `curl`, which those Jobs are. A failed PreSync hook fails the sync — measured
  # the same day — so on a `selfHeal` Application that is a reconcile loop.
  preflight:
    enabled: false
