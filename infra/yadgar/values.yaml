# THIS ORGANISATION'S VALUES FOR THE PARENT CHART, READ BY infra/yadgar-app.yaml
# AS `$self/infra/yadgar/values.yaml`.
#
# ADR-0786: any divergence between this organisation's estate and an adopter's
# must be expressible as a difference between two values files, so it is a
# visible render diff rather than invisible drift. This file IS that difference.
# Nothing environment-specific belongs anywhere else.
#
# NOT READ BY THE `infra` APP-OF-APPS. It sources `path: infra` with no
# `directory.recurse`, so a file one directory down is invisible to it — the same
# reason `infra/databases/` holds manifests that only the `databases` Application
# reads. A values file directly in `infra/` would be applied as a manifest.
#
# DERIVED FROM EACH MODULE CHART'S OWN DEFAULTS, never copied from the
# `yadgar-modules` ApplicationSet's values block (ADR-0751, ADR-0619). Every key
# below turns ON something the chart ships OFF, so an omission PRUNES a live
# object rather than leaving it alone.
#
# MEASURED 2026-09-26 against the published `yadgar:0.2.36`
# (digest sha256:2bb0f8b7ccbadc2015decacb8ccfed2a85db47dd9246a38297a2041b2ca8eec3):
# this file renders 45 objects and ZERO MariaDB. With the three `database.create`
# toggles forced true on a local render — which is merge B of
# `plans/the-mariadb-crs-into-the-chart.md`, not this file — it renders 48 and
# three MariaDB whose `spec` is byte-identical to all three live CRs.

# ── GATEWAY ──────────────────────────────────────────────────────────────────
# `tls.enabled` is gateway's OWN listener. `gateway.iam.tls.enabled` and its two
# siblings are DIALS — whether gateway speaks TLS TO that module. Two different
# questions on keys one character apart.
#
# NO `networkPolicy` KEY, DELIBERATELY. The `gateway-ingress` policy belongs to
# the `network-policies` Application (`infra/network-policies/`), so asking the
# chart for one too would give the object two owners.
gateway:
  autoscaling: { enabled: true }
  sourceAddress: { trustedProxyHops: "" }
  adminBootstrap: { tokenSecret: admin-bootstrap-token }
  tls: { enabled: true } # gateway's own listener
  gateway: { enabled: true } # the HTTPRoute
  iam: { tls: { enabled: true } } # DIAL to iam
  task: { tls: { enabled: true } } # DIAL to task
  project: { tls: { enabled: true } } # DIAL to project

# ── THE SIX SERVICES ─────────────────────────────────────────────────────────
# `scrapeFrom.namespace: observability` is where Prometheus runs; each module's
# `clients` list is the one service entitled to dial it.
iam:
  autoscaling: { enabled: true }
  tls: { enabled: true }
  iamDb: { tls: { enabled: true } }
  networkPolicy:
    {
      enabled: true,
      clients: [gateway],
      scrapeFrom: { namespace: observability },
    }

iam-db:
  autoscaling: { enabled: true }
  tls: { enabled: true }
  networkPolicy:
    { enabled: true, clients: [iam], scrapeFrom: { namespace: observability } }
  # THE ONE LINE THAT MAKES ADOPTION POSSIBLE RATHER THAN REFUSED, and it does
  # nothing until merge B flips `database.create`. `spec.storage.storageClassName`
  # carries `webhook:"inmutable"` on mariadb-operator 26.6.0, and the operator's
  # `inmutable_webhook.go` compares old and new with `reflect.DeepEqual` — so
  # REMOVING a set field is a change and is REFUSED.
  #
  # The chart's shipped default is EMPTY on purpose, because `standard` is kind's
  # local-path class and on any other cluster it leaves the PVC `Pending`
  # forever with nothing refusing. Empty renders NO `storageClassName` field, so
  # the target cluster's own default class binds.
  #
  # This cluster's three live CRs carry `standard`. Measured 2026-09-26 on
  # `yadgar:0.2.36`: WITHOUT these three lines the render omits the field on all
  # three instances and the adoption apply asks the webhook to unset it. WITH
  # them, 3 of 3 carry `storageClassName: standard` and the rendered spec differs
  # from the live last-applied spec in 0 fields.
  database:
    instance:
      storage:
        className: standard

task:
  autoscaling: { enabled: true }
  tls: { enabled: true }
  taskDb: { tls: { enabled: true } }
  networkPolicy:
    {
      enabled: true,
      clients: [gateway],
      scrapeFrom: { namespace: observability },
    }

task-db:
  autoscaling: { enabled: true }
  tls: { enabled: true }
  networkPolicy:
    { enabled: true, clients: [task], scrapeFrom: { namespace: observability } }
  # See `iam-db.database.instance.storage.className` above for why this line
  # exists and what refuses the apply without it.
  database:
    instance:
      storage:
        className: standard

project:
  autoscaling: { enabled: true }
  tls: { enabled: true }
  projectDb: { tls: { enabled: true } }
  networkPolicy:
    {
      enabled: true,
      clients: [gateway],
      scrapeFrom: { namespace: observability },
    }

project-db:
  autoscaling: { enabled: true }
  tls: { enabled: true }
  networkPolicy:
    {
      enabled: true,
      clients: [project],
      scrapeFrom: { namespace: observability },
    }
  # See `iam-db.database.instance.storage.className` above for why this line
  # exists and what refuses the apply without it.
  database:
    instance:
      storage:
        className: standard

# ── THE PLATFORM LAYER, COMING ON ONE OBJECT AT A TIME ───────────────────────
# EVERY `false` BELOW MARKS SOMETHING `deploy` STILL OWNS, and each one is moved
# by the step of `plans/retiring-the-deploy-copies.md` that deletes the copy.
# The plan's ordering is not a preference: every Application in `infra/` carries
# `prune: true` and `selfHeal: true`, so a toggle flipped while its copy still
# exists is two automated Applications pruning each other's objects. The deletion
# and the flip are ONE merge, which makes that interval empty rather than short.
# `scripts/tests/test_no_two_owners.py` is the gate that refuses the other order.
#
# THE CONVERSE DOES NOT HOLD, and reading it that way is a trap. A toggle that is
# `true` does not mean `deploy` owns nothing — after the last step `deploy` still
# owns five objects no parent toggle can render, and `preflight.enabled` is false
# for a reason that has nothing to do with ownership.
#
# THE FALSES ARE STATED RATHER THAN INHERITED. They are also the chart's own
# defaults; writing them here means a render this organisation measures is
# reproducible from this file alone, and a later parent changing a default cannot
# change this estate. `platform.enabled` true is what makes every one of them
# load-bearing — until this step they were unreachable behind the dependency
# `condition`, which is why they are written now rather than earlier.
#
# `platform.enabled: true` ADDS NO OBJECT BY ITSELF. Measured 2026-09-26 against
# the pinned `yadgar:0.2.36`: this file renders 45 tuples, and this file with
# `--set platform.enabled=true` renders the same 45. The two `valkey` keys below
# take it to 48, and the three added are exactly `Deployment/valkey`,
# `Service/valkey` and `NetworkPolicy/valkey-ingress`. That render carries ZERO
# hook-annotated objects, which is what keeps `preflight` off the live estate's
# sync at this step.
platform:
  enabled: true

  # ── VALKEY: THE PARENT'S, AS OF STEP 3 ─────────────────────────────────────
  # `infra/valkey-app.yaml`, `infra/valkey/` and the `valkey-ingress` half of
  # `infra/network-policies/shared-infrastructure.yaml` were deleted in the merge
  # that set this true.
  valkey:
    create: true

  # ── STILL `deploy`'S ───────────────────────────────────────────────────────
  # Each line names the step that moves it and the copy that has to go first.
  internalCA:
    create: false # step 5, with infra/internal-tls/
  certificates:
    create: false # step 5, with infra/internal-tls/
  edgeTLS:
    create: false # step 7, with infra/tls/certificate.yaml
  gatewayListener:
    create: false # step 7, with infra/tls/{gateway,gatewayclass,envoyproxy}.yaml
  nats:
    create: false # step 6, with infra/nats.yaml
  bootstrap:
    create: false # step 9, with infra/bootstrap/
    iamKeys:
      create: false # step 9, and the Secret it mints is unrecoverable

  # THE OPERATORS RELEASE IS NOT THIS ORGANISATION'S PATH (ADR-0787). `infra/`
  # installs cert-manager, KEDA, mariadb-operator, Envoy Gateway and Argo CD as
  # Applications of their own, and no step of the retirement plan moves them.
  operators:
    create: false

  # NOT IN THE RETIREMENT PLAN'S SCOPE, and off for a different reason from every
  # toggle above: cost per sync, not ownership. It defaults TRUE in the chart —
  # the one exception to that chart's default-false convention — so leaving it
  # unstated would turn three PreSync hook Jobs on for this estate the moment a
  # `platform.*.create` above resolves a probe. Measured 2026-09-26 on
  # `platform` 0.1.12: the cert-manager and KEDA arms of `preflight`, and the
  # whole post-install `envoy-gateway-probe`, FAIL on a healthy cluster. Their
  # `condition_matches` parses the API server's answer as compact JSON, and the
  # API server pretty-prints for any client whose `User-Agent` begins with
  # `curl`, which those Jobs are. A failed PreSync hook fails the sync — measured
  # the same day — so on a `selfHeal` Application that is a reconcile loop.
  preflight:
    enabled: false
