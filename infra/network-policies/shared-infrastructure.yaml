# Defence in depth for the shared cache and the shared broker (ledger 518).
#
# ─────────────────────────────────────────────────────────────────────────────
# READ THIS FIRST: EVERYTHING IN THIS FILE IS ENFORCED ON THE REFERENCE CLUSTER
# ─────────────────────────────────────────────────────────────────────────────
#
# THIS HEADER SAID THE OPPOSITE UNTIL LEDGER 896, and the correction is recorded
# in place rather than overwritten, because the false half was an INFERENCE and
# not the measurement it rested on. A reader told only that the old text was
# wrong would go and re-measure the wrong thing.
#
# THE MEASUREMENT WAS RIGHT AND STILL IS: the reference cluster is kind, its CNI
# is kindnet, and `kube-system` runs a `kindnet` DaemonSet with no Calico, Cilium
# or Weave. THE INFERENCE FROM IT — "therefore nothing evaluates a
# NetworkPolicy here" — IS FALSE, and stopped being true when kindnetd gained a
# policy controller (ledger 684).
#
# What is measured today (2026-09-14):
#
# - The DaemonSet runs `docker.io/kindest/kindnetd:v20260528-9350166c`.
# - The `kindnet` ClusterRole grants `networking.k8s.io/networkpolicies` `list`
#   and `watch`, and the pod holds `NET_ADMIN` and `NET_RAW`. A CNI that ignored
#   NetworkPolicy would need neither the watch nor the capabilities.
# - Ledger 511 proved enforcement LIVE twelve times over: six module ingress
#   policies, each dropping an unallowed peer at the 4s connect deadline while
#   the allowed control connected at 0s.
#
# So a pod with no label here CANNOT open a connection to Valkey on 6379, and
# this file may be read as protection, because it is protection.
#
# WHAT CLOSED TASK 518 IS STILL THE SERVER-SIDE HALF: `requirepass` on the cache
# (infra/valkey/valkey.yaml) and the `authorization` block on the broker
# (infra/nats.yaml). Those hold on every CNI and every platform, which is what
# D80 asks for, and that ordering was right — the server-enforced control leads
# and the policy follows. What has changed is only that the second layer is a
# live one rather than a specification.
#
# ─────────────────────────────────────────────────────────────────────────────
# KUBELET PROBES, AND WHY NO NODE CIDR RULE IS NEEDED
# ─────────────────────────────────────────────────────────────────────────────
#
# Valkey's `livenessProbe` is a `tcpSocket` on 6379 dialled by the kubelet from
# the NODE, and NATS' probes are `httpGet` on 8222. No rule below names either
# source, and both keep passing: probe traffic does not originate from a pod, so
# a pod-selector ingress rule never applies to it. That is ADR-0592, measured on
# a valkey pod with `restartCount` 0 across 13 hours behind exactly these rules.
#
# THIS SECTION IS NOW LOAD-BEARING FOR THE BROKER, AND IT WAS NOT BEFORE. Until
# the monitoring port was narrowed, 8222 carried no source restriction at all,
# so the exemption bought NATS nothing — the probes were admitted the way every
# other source was. Narrowing that rule makes the exemption the ONLY thing
# keeping three `httpGet` probes alive on a healthy broker. Read this section as
# a live dependency of the rule below, not as background. The argument beside
# that rule carries the measurement; this is the pointer to it.
#
# So no node CIDR is written here, because none is needed. The corollary is the
# part worth carrying: A PASSING PROBE IS NO EVIDENCE THAT THIS POLICY IS ABSENT
# OR UNENFORCED. This estate has drawn that inference wrongly twice.
#
# **Egress is not restricted at all**, only ingress. Egress rules need DNS
# carve-outs to be usable, and a half-written egress policy breaks name
# resolution for everything it selects. Ingress is the half that answers the
# finding.
#
# ─────────────────────────────────────────────────────────────────────────────
# SELECTORS
# ─────────────────────────────────────────────────────────────────────────────
#
# **A podSelector that matches nothing is accepted, listed and describable, and
# protects nothing.** Enforcement does not make a typo visible — the estate has
# no control that refuses a policy whose selector matches nothing (ADR-0685). So
# every label below was read off rendered output rather than recalled:
# `app.kubernetes.io/name: valkey` from the Deployment in
# infra/valkey/valkey.yaml, `app.kubernetes.io/name: nats` from `helm template`
# of the nats chart at the pinned version, and `app: gateway` / `app: iam` from
# `helm template` of each module's own chart, which labels pods `app:
# {{ .Chart.Name }}`.
#
# Verify with:
#
#   kubectl -n yadgar get pod -l app.kubernetes.io/name=valkey
#   kubectl -n yadgar get pod -l app=gateway
#
# Empty output means the policy selects nothing and protects nothing.
---
# THE ONE CONSUMER IS `gateway`, and that is measured rather than recalled: the
# `redis` crate appears in exactly one Cargo.toml in the organisation, and it is
# `gateway`'s. So this is a list of one rather than a shortcut.
#
# THE HEADER OF infra/valkey/valkey.yaml DESCRIBES MORE THAN THAT. It names D17's
# row and query caches inside each twin, D29's conversation tokens and D46's
# throttle counters — what the cache is FOR, not who dials it today. Each of those
# arriving is a service that has to be added here.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: valkey-ingress
  namespace: yadgar
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: valkey }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: gateway }
      ports:
        - protocol: TCP
          port: 6379
---
# TWO CONSUMERS NOW (gateway#17): `iam` — `invalidate.rs` — publishes D72's
# cache invalidation, and `gateway` subscribes to it from its own
# `invalidate.rs`. Each new consumer of the broker has to be added to this
# list the same way; a revocation event that never arrives is exactly the kind
# of failure that looks like a caching bug rather than a policy one.
#
# THREE PORTS, not one, and the two extra are why this is worth reading. A
# NetworkPolicy with any ingress rule DENIES every port it does not name, so a
# policy naming only 4222 would cut the monitoring endpoint the chart's own
# probes use — restarting a healthy broker on the first CNI that enforces this.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nats-ingress
  namespace: yadgar
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: nats }
  policyTypes: [Ingress]
  ingress:
    # The client port. The whole point of the file.
    - from:
        - podSelector:
            matchLabels: { app: iam }
        - podSelector:
            matchLabels: { app: gateway }
      ports:
        - protocol: TCP
          port: 4222
    # THE MONITORING PORT, NARROWED TO THIS NAMESPACE.
    #
    # WHAT IT USED TO BE. This rule carried no `from` at all, unlike the sibling
    # rules around it, and that is not a narrower scope — it is the widest one
    # there is. An ingress rule whose `from` is absent or empty matches ALL
    # sources: every namespace, and whatever else the cluster's CNI presents to
    # this pod (ADR-0664). Not "from anywhere in the namespace", which is what
    # this comment said before deploy#52 corrected it. 8222 is plain HTTP with
    # no authorization on it, so the network layer is the only thing that scopes
    # it, and any workload anywhere could GET `/varz`, `/connz` or `/subsz` and
    # read back subject names, connected clients and the server's configuration.
    #
    # THE RISK THE NARROWING HAD TO CLEAR. A NetworkPolicy with any ingress rule
    # DENIES every source it does not name, and all THREE of the upstream
    # chart's probes — startup, readiness and liveness — are `httpGet` against
    # the `monitor` port, which is this one. Kubelet probes originate from the
    # NODE, and a `namespaceSelector` matches PODS, so if node-sourced traffic
    # were subject to this rule the narrowing would restart a healthy broker in
    # a loop. It is not, and that was MEASURED rather than reasoned:
    #
    #   * kindnetd v20260528-9350166c runs the `kube-network-policies`
    #     controller, and its enforcement is proven by demanded refusal —
    #     ADR-0688's twelve observations are SIX refusals, each against its own
    #     unpoliced control. Enforcement is an established premise here, not an
    #     assumption, which is what makes the next line evidence at all.
    #   * `project-ingress` is the controlled comparison, on ONE policy object.
    #     It names port 50052 in a single rule with `from: [podSelector{app:
    #     gateway}]`. Ledger 511 measured a probe pod timing out against
    #     `project:50052` at the 4s deadline while unpoliced controls connected
    #     at 0s — and on that same policy, same port, the kubelet's tcpSocket
    #     probe succeeds continuously with both `project` pods 1/1 Ready. Same
    #     policy, same port: pod peer dropped, node peer admitted.
    #
    # ADR-0592 IS THE RULE, AND IT POINTS THE OTHER WAY. Its finding is that
    # kubelet probe traffic IS exempt from ingress NetworkPolicy; what it
    # forbids is the REVERSE inference, that a policy is absent or unenforced
    # because a probe passes. The comment that stood here read that one-way
    # caution as a claim that probe behaviour under a narrower rule is
    # unknowable, and so argued for allow-all from a reference that says probes
    # are exempt.
    #
    # THE LIVE PROBES CITED ABOVE ARE `tcpSocket` AND THESE ARE `httpGet`, AND
    # THE EVIDENCE STILL TRANSFERS. NetworkPolicy is an L3/L4 control. An
    # `httpGet` probe is a TCP connection from the kubelet to the pod IP on this
    # port, with a request written into it once the connection is up. The
    # difference between the two probe kinds is entirely above the layer this
    # rule acts on.
    #
    # NOTHING OUTSIDE THIS NAMESPACE WAS READING IT, measured on the live
    # cluster on 2026-09-24 by sweeping all 112 listable resource types, 1029
    # objects, with no type failing to list. NINE objects name 8222 and every
    # one is the broker's own or derived from it: the StatefulSet `yadgar/nats`,
    # its ConfigMap `nats-config`, its Service and Endpoints and EndpointSlice
    # `nats-headless`, its ControllerRevision, the Pod `nats-0`, this
    # NetworkPolicy, and the Argo `Application argocd/nats` — which names 8222
    # only inside a COMMENT in its inline Helm values, not in a setting. Beside
    # that census: no `PodMonitor` or `ServiceMonitor` CRD exists, `nats-0`
    # carries an EMPTY annotations map and so no `prometheus.io/*` scrape
    # annotation, all seven KEDA ScaledObjects trigger on `prometheus` against
    # `prometheus-server.observability.svc.cluster.local` and none on
    # `nats-jetstream`, `natsBox` is off, and `estate-front` has no pods.
    #
    # THE ALTERNATIVE THAT WAS NOT TAKEN. An `ipBlock` for the node CIDR would
    # admit the kubelet explicitly rather than rely on the exemption. It is not
    # written here because `ipBlock` cannot say "the node this pod runs on",
    # only "every node" — so it trades a measured exemption for a CIDR that has
    # to be re-stated by hand every time the cluster's node network changes.
    #
    # THE CAVEAT THAT SURVIVES THE NARROWING, and it is the one true sentence
    # the old comment had: this leaves the probes to the CNI'S TREATMENT OF HOST
    # TRAFFIC, which is the thing that varies between CNIs. The exemption is
    # measured on kindnet HERE and is the behaviour Kubernetes intends, but a
    # cluster whose CNI subjects node-sourced traffic to pod-selector rules gets
    # probes that fail against this rule. D80: this measurement is from this
    # estate's reference cluster, and that is the only cluster it covers.
    #
    # `kubernetes.io/metadata.name` is set by kube-apiserver on every Namespace,
    # so this needs no labelling step of its own. The value matches this
    # policy's own `metadata.namespace` above, and
    # `scripts/policy_sources_named.py` asserts that it does rather than
    # accepting any namespace that happens to be named.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: yadgar
      ports:
        - protocol: TCP
          port: 8222
    # The cluster port, from the broker's own pods. `config.cluster.enabled` is
    # false today, so this matches nothing — it is here so that turning clustering
    # on does not silently produce a broker whose members cannot route to each
    # other, which presents as JetStream never becoming ready.
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: nats }
      ports:
        - protocol: TCP
          port: 6222
