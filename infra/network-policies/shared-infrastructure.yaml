# Defence in depth for the shared cache and the shared broker (ledger 518).
#
# ─────────────────────────────────────────────────────────────────────────────
# READ THIS FIRST: EVERYTHING IN THIS FILE IS ENFORCED ON THE REFERENCE CLUSTER
# ─────────────────────────────────────────────────────────────────────────────
#
# THIS HEADER SAID THE OPPOSITE UNTIL LEDGER 896, and the correction is recorded
# in place rather than overwritten, because the false half was an INFERENCE and
# not the measurement it rested on. A reader told only that the old text was
# wrong would go and re-measure the wrong thing.
#
# THE MEASUREMENT WAS RIGHT AND STILL IS: the reference cluster is kind, its CNI
# is kindnet, and `kube-system` runs a `kindnet` DaemonSet with no Calico, Cilium
# or Weave. THE INFERENCE FROM IT — "therefore nothing evaluates a
# NetworkPolicy here" — IS FALSE, and stopped being true when kindnetd gained a
# policy controller (ledger 684).
#
# What is measured today (2026-09-14):
#
# - The DaemonSet runs `docker.io/kindest/kindnetd:v20260528-9350166c`.
# - The `kindnet` ClusterRole grants `networking.k8s.io/networkpolicies` `list`
#   and `watch`, and the pod holds `NET_ADMIN` and `NET_RAW`. A CNI that ignored
#   NetworkPolicy would need neither the watch nor the capabilities.
# - Ledger 511 proved enforcement LIVE twelve times over: six module ingress
#   policies, each dropping an unallowed peer at the 4s connect deadline while
#   the allowed control connected at 0s.
#
# So a pod with no label here CANNOT open a connection to Valkey on 6379, and
# this file may be read as protection, because it is protection.
#
# WHAT CLOSED TASK 518 IS STILL THE SERVER-SIDE HALF: `requirepass` on the cache
# (infra/valkey/valkey.yaml) and the `authorization` block on the broker
# (infra/nats.yaml). Those hold on every CNI and every platform, which is what
# D80 asks for, and that ordering was right — the server-enforced control leads
# and the policy follows. What has changed is only that the second layer is a
# live one rather than a specification.
#
# ─────────────────────────────────────────────────────────────────────────────
# KUBELET PROBES, AND WHY NO NODE CIDR RULE IS NEEDED
# ─────────────────────────────────────────────────────────────────────────────
#
# Valkey's `livenessProbe` is a `tcpSocket` on 6379 dialled by the kubelet from
# the NODE, and NATS' probes are `httpGet` on 8222. No rule below names either
# source, and both keep passing: probe traffic does not originate from a pod, so
# a pod-selector ingress rule never applies to it. That is ADR-0592, measured on
# a valkey pod with `restartCount` 0 across 13 hours behind exactly these rules.
#
# So no node CIDR is written here, because none is needed. The corollary is the
# part worth carrying: A PASSING PROBE IS NO EVIDENCE THAT THIS POLICY IS ABSENT
# OR UNENFORCED. This estate has drawn that inference wrongly twice.
#
# **Egress is not restricted at all**, only ingress. Egress rules need DNS
# carve-outs to be usable, and a half-written egress policy breaks name
# resolution for everything it selects. Ingress is the half that answers the
# finding.
#
# ─────────────────────────────────────────────────────────────────────────────
# SELECTORS
# ─────────────────────────────────────────────────────────────────────────────
#
# **A podSelector that matches nothing is accepted, listed and describable, and
# protects nothing.** Enforcement does not make a typo visible — the estate has
# no control that refuses a policy whose selector matches nothing (ADR-0685). So
# every label below was read off rendered output rather than recalled:
# `app.kubernetes.io/name: valkey` from the Deployment in
# infra/valkey/valkey.yaml, `app.kubernetes.io/name: nats` from `helm template`
# of the nats chart at the pinned version, and `app: gateway` / `app: iam` from
# `helm template` of each module's own chart, which labels pods `app:
# {{ .Chart.Name }}`.
#
# Verify with:
#
#   kubectl -n yadgar get pod -l app.kubernetes.io/name=valkey
#   kubectl -n yadgar get pod -l app=gateway
#
# Empty output means the policy selects nothing and protects nothing.
---
# THE ONE CONSUMER IS `gateway`, and that is measured rather than recalled: the
# `redis` crate appears in exactly one Cargo.toml in the organisation, and it is
# `gateway`'s. So this is a list of one rather than a shortcut.
#
# THE HEADER OF infra/valkey/valkey.yaml DESCRIBES MORE THAN THAT. It names D17's
# row and query caches inside each twin, D29's conversation tokens and D46's
# throttle counters — what the cache is FOR, not who dials it today. Each of those
# arriving is a service that has to be added here.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: valkey-ingress
  namespace: yadgar
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: valkey }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: gateway }
      ports:
        - protocol: TCP
          port: 6379
---
# TWO CONSUMERS NOW (gateway#17): `iam` — `invalidate.rs` — publishes D72's
# cache invalidation, and `gateway` subscribes to it from its own
# `invalidate.rs`. Each new consumer of the broker has to be added to this
# list the same way; a revocation event that never arrives is exactly the kind
# of failure that looks like a caching bug rather than a policy one.
#
# THREE PORTS, not one, and the two extra are why this is worth reading. A
# NetworkPolicy with any ingress rule DENIES every port it does not name, so a
# policy naming only 4222 would cut the monitoring endpoint the chart's own
# probes use — restarting a healthy broker on the first CNI that enforces this.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nats-ingress
  namespace: yadgar
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: nats }
  policyTypes: [Ingress]
  ingress:
    # The client port. The whole point of the file.
    - from:
        - podSelector:
            matchLabels: { app: iam }
        - podSelector:
            matchLabels: { app: gateway }
      ports:
        - protocol: TCP
          port: 4222
    # The monitoring port, from ANYWHERE AT ALL, and deliberately not narrowed.
    # This rule carries no `from`, unlike the sibling rules around it, and that
    # is not a narrower scope — it is the widest one there is. An ingress rule
    # whose `from` is absent or empty matches ALL sources: every namespace, and
    # whatever else the cluster's CNI presents to this pod. Not "from anywhere
    # in the namespace", which is what this comment used to say. It is HTTP
    # with no authorization and no secrets on it, the chart's startup,
    # readiness and liveness probes all use it, and a NetworkPolicy with any
    # ingress rule denies every port it does not name, so naming only 4222
    # would cut this endpoint. Narrowing it to Prometheus would leave the
    # probes to the CNI's treatment of host traffic, which is the thing that
    # varies — kubelet probes not being subject to pod-selector ingress rules
    # is not itself a reason narrowing would be safe.
    - ports:
        - protocol: TCP
          port: 8222
    # The cluster port, from the broker's own pods. `config.cluster.enabled` is
    # false today, so this matches nothing — it is here so that turning clustering
    # on does not silently produce a broker whose members cannot route to each
    # other, which presents as JetStream never becoming ready.
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: nats }
      ports:
        - protocol: TCP
          port: 6222
