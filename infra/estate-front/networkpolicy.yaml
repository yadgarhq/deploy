# The confinement C-18 tests.
#
# ─────────────────────────────────────────────────────────────────────────────
# READ THIS FIRST: THE CNI DOES IMPLEMENT NetworkPolicy. THE EGRESS HALF, WHICH
# IS ALL THIS FILE CONTAINS, HAS STRONG CIRCUMSTANTIAL EVIDENCE AND NO OBSERVED
# DROP
# ─────────────────────────────────────────────────────────────────────────────
#
# THIS HEADER SAID "THE CNI IS kindnet, WHICH DOES NOT IMPLEMENT NetworkPolicy"
# UNTIL LEDGER 896. That is false and has been since ledger 684. The correction
# is recorded in place, because the false half was an INFERENCE rather than the
# measurement underneath it.
#
# STILL TRUE: the CNI is kindnet, and `kube-system` runs a `kindnet` DaemonSet
# with no Calico, Cilium or Weave. NO LONGER TRUE: that nothing evaluates a
# NetworkPolicy here. Measured 2026-09-14 — the DaemonSet runs
# `docker.io/kindest/kindnetd:v20260528-9350166c`, the `kindnet` ClusterRole
# grants `networking.k8s.io/networkpolicies` `list` and `watch`, and the pod
# holds `NET_ADMIN` and `NET_RAW`. Ledger 511 then proved INGRESS enforcement
# live twelve times over, across six module policies.
#
# THE HALF THIS FILE ACTUALLY USES IS THE EGRESS HALF, and every one of those
# twelve drops was an INGRESS rule. This policy is `policyTypes: [Ingress,
# Egress]` and its whole substance is egress. THIS PARAGRAPH SAID "NOTHING HERE
# HAS WATCHED kindnetd DROP AN EGRESS PACKET" UNTIL LEDGER 917. As a statement
# about packet-level observation that is true. As a statement about what the
# estate knows it erases a real and discriminating measurement, so the
# measurement is written here instead of the slogan.
#
# WHAT IS MEASURED (ledger 917, read-only, 2026-09-14). Every non-cancelled
# `smoke.yaml` run on `yadgarhq/estate` carries the "C-18 confinement" step: 143
# runs, 107 green, 36 skipped, ZERO red. Each green step took 18-21s of wall
# clock, and one run's own output — `33999752662` — reads `test result: ok.
# 1 passed; ... finished in 18.02s`, which is six addresses ×
# `connect_timeout_ms = 3000` in `reference.toml`. 99 of the 107 greens fall in
# the window between this policy's creation (`2026-09-05T12:40:19Z`) and the
# creation of `iam-db-ingress` (`2026-09-13T10:29:00Z`). IN THAT WINDOW FIVE OF
# THE SIX ADDRESSES C-18 DIALS WERE SELECTED BY NO INGRESS POLICY AT ALL:
# `iam-db` and `task-db` are headless, so they resolve to pod addresses in
# `10.244.0.0/16`, and no policy selects the `app.kubernetes.io/name: mariadb`
# pod behind `iam-db-mariadb`. Only `valkey`'s single address was covered, by
# `valkey-ingress`. So for five of the six, THIS POLICY IS THE ONLY OBJECT THAT
# COULD HAVE PRODUCED THE TIMEOUT.
#
# WHAT IS STILL NOT MEASURED. That argument settles ATTRIBUTION, not
# OBSERVATION. A timeout is what a DROP looks like; nothing here has read a drop
# counter or a kindnetd log line for an egress packet, and the controller logs
# no drops at default verbosity. The accurate sentence is therefore: STRONG
# CIRCUMSTANTIAL EVIDENCE OF EGRESS ENFORCEMENT, AND NO DIRECTLY OBSERVED
# DROPPED EGRESS PACKET. Neither "proved" nor "unmeasured" says that, and this
# file has used both words before it used these.
#
# C-18 WAS NEVER RED (ledger 916). The 143 executions above contain no failure,
# so the "red by design until the CNI changes" story this header used to tell
# was never what the runs said. The blanket reason for that story is gone twice
# over: the CNI does enforce, and the row has never once reported a failure.
#
# LEDGER 614 — swap the CNI for Cilium or Calico, due 2026-10-03, owned by the
# nix repo per ADR-0480 — was filed on the claim this header used to make. That
# premise is gone. Whether the row survives on other grounds, such as the
# FQDN-aware egress rule for GitHub that rule (d) below says plainly it cannot
# express, is for the record to decide rather than this file.
#
# ─────────────────────────────────────────────────────────────────────────────
# WHAT THIS POLICY SELECTS, AND WHAT IT DOES NOT
# ─────────────────────────────────────────────────────────────────────────────
#
# `podSelector: {}` is every pod in `estate-front`, which is the runner pods and
# nothing else. ARC's LISTENER — the pod that holds the GitHub App credential —
# runs in the CONTROLLER's namespace, not here: verified in ARC's own source,
# where `autoscalingrunnerset_controller.go` creates the `AutoscalingListener`
# with `Namespace: r.ControllerNamespace`. So the listener is `arc-systems`'
# business and is unconfined; see the comment in infra/arc.yaml. What this file
# confines is the pods that execute workflow code, which is the surface the
# suite's own bugs and its dependencies live on.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: estate-front-egress
  namespace: estate-front
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  # NO INGRESS RULES AT ALL, which denies all ingress. A CI runner is dialled by
  # nothing; it dials out. An empty `ingress:` list would say the same thing
  # less clearly, so the absence is deliberate and this comment is the record.
  egress:
    # (a) Name resolution. Without this the runner resolves neither github.com
    # nor the `*.svc.cluster.local` names C-18 must prove exist, and the suite
    # fails at DNS rather than at a contract.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    # (b) THE EDGE, AND ONLY THE EDGE. Selected by the Envoy Gateway labels
    # rather than by Service name: the live Service is
    # `envoy-yadgar-edge-a2648de2`, whose suffix is a hash that changes when the
    # Gateway is recreated. A policy naming the Service by name would silently
    # stop matching, and the suite would then be unable to reach the edge for a
    # reason nothing explains.
    #
    # 10443 IS THE PORT THAT ACTUALLY MATTERS. Measured 2026-09-05: the edge
    # Service is `port 443 → targetPort 10443 → nodePort 30443`, so the Envoy
    # pods LISTEN ON 10443. Egress is evaluated after DNAT on both Cilium and
    # Calico — by the time the policy sees the packet the Service port has
    # already been translated to the pod's `targetPort` — so a rule naming only
    # 443 would refuse every connection to the edge. Rule (d) below excepts the
    # Service CIDR, so there would be no second path and the runner could not
    # reach the edge at all. THIS CLAUSE USED TO SAY THE FILE IS DORMANT UNTIL
    # THE CNI CHANGES; the CNI does implement NetworkPolicy (see the header), so
    # that mistake can surface as the suite being unable to reach the edge for a
    # reason nothing explains — which is why the reason is written down rather
    # than left to be rediscovered.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: envoy
              gateway.envoyproxy.io/owning-gateway-name: edge
              gateway.envoyproxy.io/owning-gateway-namespace: yadgar
      ports:
        - protocol: TCP
          port: 10443

    # (c) THE SAME EDGE, ADDRESSED AS THE Service, for a CNI that evaluates
    # egress BEFORE DNAT. There is exactly one such address and it is pinned:
    # `yadgar-edge` in edge-service.yaml holds 10.96.0.100, and the runner's
    # `hostAliases` entry maps `gateway.yadgar.internal` to it. Rule (d) excepts
    # the whole Service CIDR, so without this rule a pre-DNAT CNI would drop the
    # connection.
    #
    # ON CILIUM AND CALICO THIS RULE NEVER MATCHES ANYTHING, and that is
    # expected rather than a sign it is wrong — those two see the translated
    # pod address and take rule (b). Allowing one address that is either the
    # edge or nothing costs nothing.
    - to:
        - ipBlock:
            cidr: 10.96.0.100/32
      ports:
        - protocol: TCP
          port: 443

    # (d) GitHub, expressed as "the internet, but nothing in this cluster".
    #
    # NetworkPolicy has no FQDN rule, so "GitHub" is not directly sayable. The
    # portable form is an `ipBlock` of everything with the cluster's own ranges
    # excepted — which is coarser than GitHub and says so: a compromised runner
    # could reach any host on :443. Narrowing it needs an FQDN-aware policy
    # (Cilium), which is a decision that belongs with the CNI choice in ledger
    # 614 rather than a thing to pretend is already made.
    #
    # THE THREE EXCEPTED RANGES WERE MEASURED (2026-09-05), not assumed. Pod
    # 10.244.0.0/16 (`.spec.podCIDR` is a /24 per node: .0, .1 and .2),
    # Service 10.96.0.0/16 (`--service-cluster-ip-range` on the live
    # `kube-apiserver`), node 10.89.4.0/24 (the container network the three kind
    # nodes sit on: 10.89.4.8, .9 and .10). A wrong or stale range here is a
    # hole, so re-measure when the cluster is rebuilt.
    #
    # THE NODE RANGE IS EXCEPTED ON PURPOSE, and it is what closes the back
    # door: the edge is also a NodePort on 30443, and a runner able to reach a
    # node address could dial the estate without going near this policy's edge
    # rules. It could not skip the certificate — the edge serves one — but it
    # could skip everything this policy is for.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.244.0.0/16
              - 10.96.0.0/16
              - 10.89.4.0/24
      ports:
        - protocol: TCP
          port: 443
