# One shared deployment, one key namespace per -db service (D21). Holds the row
# and query caches D17 places inside each twin, the epoch counters that replace
# D18's in-process bus, conversation tokens (D29), throttle counters (D46) and
# the debounced last_seen_at of D52.
#
# NOT a cache service fronting the databases — D21 rejects that explicitly. Each
# -db owns its own invalidation because under D4 it is the only single writer
# that can do it correctly.
#
# CHART SOURCE IS A KNOWN RISK. Bitnami restricted its free image distribution
# in 2025; the chart resolves but its images may not stay pullable. Verify
# before relying on it, and treat the official Valkey image with a hand-written
# manifest as the fallback. O10's standing instruction applies.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: valkey
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: default
  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: valkey
    targetRevision: 6.2.13
  destination:
    server: https://kubernetes.default.svc
    namespace: yadgar-infra
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
