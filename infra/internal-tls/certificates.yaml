---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: task-db-tls
  namespace: yadgar
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  secretName: task-db-tls
  commonName: task-db
  dnsNames:
    - task-db
    - task-db.yadgar
    - task-db.yadgar.svc
    - task-db.yadgar.svc.cluster.local
  duration: 2160h # 90d
  renewBefore: 744h # 30d +24h; the ladder in this file's header
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    name: yadgar-internal-ca
