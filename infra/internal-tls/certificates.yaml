    argocd.argoproj.io/sync-wave: "0"
spec:
  secretName: task-tls
  commonName: task
  dnsNames:
    - task
    - task.yadgar
    - task.yadgar.svc
    - task.yadgar.svc.cluster.local
  duration: 2160h # 90d
  renewBefore: 732h # 30d +12h; the ladder in this file's header
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - server auth
    - digital signature
  issuerRef:
    name: yadgar-internal-ca
    kind: Issuer
