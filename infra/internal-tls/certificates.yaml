---
# The project registry's serving leaf, and the first certificate added to this
# file after the bootstrap that minted the other four. It copies `iam-db-tls`
# and `task-db-tls` rather than `iam-tls` or `task-tls`, because `project-db` is
# the same kind of module they are: a headless `-db` answering gRPC on 50051
# that calls nothing over this authority.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: project-db-tls
  namespace: yadgar
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  # THE NAME THE CHART ALREADY READS, not a convention this file assumes.
  # `project-db/chart/values.yaml` ships `tls.certSecret: project-db-tls` with
  # `tls.certSecretKey: tls.crt` and `tls.keySecretKey: tls.key`, and
  # `yadgarhq/argocd` overrides none of the three — its shared `tls.enabled:
  # true` reaches every module chart and names no Secret. So the pod is already
  # mounting a volume for this exact Secret name and finding nothing in it.
  secretName: project-db-tls
  commonName: project-db
  # HEADLESS, like both sibling `-db` services: `kubectl get svc -n yadgar`
  # reads `clusterIP: None` for `project-db`. The certificate names the SERVICE,
  # because that is the name a client verifies against however many pod
  # addresses it dialled.
  dnsNames:
    - project-db
    - project-db.yadgar
    - project-db.yadgar.svc
    - project-db.yadgar.svc.cluster.local
  duration: 2160h # 90d
  renewBefore: 768h # 30d +48h; the next free step on this file's ladder
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    # `server auth` AND NOT `client auth`, identical to the four leaves above.
    # This module answers and never calls, so a `client auth` bit here would
    # widen the leaf for a caller that does not exist — and under the ONE
    # authority this deployment runs, the absence of that bit is exactly what
    # stops a stolen serving certificate being replayed as a client credential.
    # `digital signature` is the plain key usage a TLS 1.3 handshake exercises,
    # named rather than left to a default.
    #
    # OMITTING THIS BLOCK WOULD BE THE TRAP RATHER THAN WIDENING IT.
    # cert-manager then issues a leaf with no extended key usage, which webpki
    # accepts in BOTH directions. The `certificate-usages` hook refuses an
    # absent or empty `usages` and a list naming both directions, for every
    # Certificate in this repository — not only the ones under `infra/`, and not
    # only the ones naming this issuer, both of which the local hook it replaced
    # would have skipped (ledger 720). `ci-pr` runs it on the pull request as
    # well as on the commit.
    - server auth
    - digital signature
  issuerRef:
    name: yadgar-internal-ca
    kind: Issuer
    group: cert-manager.io
---
# The project registry's LOGIC-TIER serving leaf, and the SECOND certificate
# added to this file after the bootstrap. It copies `task-tls` rather than
# `project-db-tls`, because `project` is the kind of module `iam` and `task`
# are: it answers gRPC on 50052 AND it calls `project-db`, so it takes a client
# leaf in `client-certificates.yaml` as well as this one. `project-db` takes
# only this direction because it never calls.
#
# THIS LEAF LANDS BEFORE THE MODULE, DELIBERATELY, AND THE ORDER IS THE WHOLE
# REASON THE OBJECT IS WRITTEN NOW. `yadgarhq/project` does not exist yet.
# `yadgarhq/argocd` sets `tls.enabled: true` for every module chart, the chart
# therefore mounts a volume for `tls.certSecret`, and `optional: true` turns an
# ABSENT Secret into an EMPTY DIRECTORY rather than a `FailedMount` — so a
# module deployed before its leaf exists reports a missing path from inside the
# binary and crash-loops. That is exactly what `project-db` did (ledger 641).
# The certificate must exist BEFORE the `yadgar-deployable` topic is added to
# the repository. Nothing enforces that ordering, which is why it is written
# here and in `MIGRATION_NOTES.md`.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: project-tls
  namespace: yadgar
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  # `<service>-tls`, the convention every leaf above follows. UNLIKE
  # `project-db-tls`, this name is NOT read back off a chart that already ships
  # it — `yadgarhq/project` is unwritten — so this is the name that repository
  # must adopt rather than a name measured from it.
  secretName: project-tls
  commonName: project
  # NO HEADLESS CLAIM IS MADE HERE. `kubectl get svc -n yadgar` has no
  # `project` row on 2026-09-07, because the module is not deployed. The four
  # names are listed for the reason every leaf above lists them: a caller in
  # another namespace dials a longer one, and a certificate naming only
  # `project` is a silent trap for the first such caller. That argument holds
  # whichever way the Service is eventually declared.
  dnsNames:
    - project
    - project.yadgar
    - project.yadgar.svc
    - project.yadgar.svc.cluster.local
  duration: 2160h # 90d
  renewBefore: 774h # 30d +54h; the next free step on this directory's ladder
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    # `server auth` AND NOT `client auth`, identical to the five leaves above.
    # `project` DOES call — it dials `project-db` — and that direction is
    # `project-client-tls` in `client-certificates.yaml`, separate material with
    # a separate key. Naming both here would collapse the wall that replaces a
    # second certificate authority, on the one module in this file where the
    # temptation is real because both directions genuinely exist.
    #
    # OMITTING THE BLOCK WOULD BE WORSE THAN WIDENING IT. cert-manager then
    # issues a leaf with no extended key usage at all, which webpki accepts in
    # BOTH directions. The `certificate-usages` hook refuses both shapes.
    - server auth
    - digital signature
  issuerRef:
    name: yadgar-internal-ca
    kind: Issuer
    group: cert-manager.io
