# One serving certificate per service, issued by the internal root beside this
# file. THE CUT-OVER HAS HAPPENED, so read this as live material rather than as
# material waiting for a lever. `tls.enabled: true` is set for all four server
# charts by `yadgarhq/argocd`, and every internal listener runs with
# `LISTEN_TLS_ENABLED=1` — checked on the pods, not assumed from the manifest.
# A change here reaches a serving hop.
#
# ── THE SAN IS THE SERVICE NAME, AND NOT AN IP ──────────────────────────────
# A client verifies the certificate against THE HOST IT ASKED FOR, not the
# address it reached: `dial` sets `ClientTlsConfig::domain_name` from the
# configured host, which is the in-cluster Service name — `iam`, `iam-db`,
# `task`, `task-db`. That is what makes ONE certificate work across every pod
# behind a headless Service, which three of these four are.
#
# So there are NO IP SANs here and nothing may start relying on one. This
# estate has already paid for that lesson once: the development root CA excludes
# every IP, and a by-IP request correctly returns `000`.
#
# The longer forms are listed beside the short one because a caller in another
# namespace would have to use them, and a certificate that names only `iam` is
# a silent trap for the first such caller. All four names are the same host.
#
# ── EACH SECRET IS READ BY BOTH ENDS OF THE HOP ─────────────────────────────
# cert-manager writes three keys into the Secret of a certificate issued by a CA
# issuer: `tls.crt`, `tls.key` and `ca.crt`. Verified against the existing
# `gateway-tls` Secret rather than assumed.
#
# That is exactly the shape the charts already expect, and it is why no separate
# CA Secret exists here. The SERVER mounts its own Secret and reads `tls.crt`
# plus `tls.key` (`certSecret` / `certSecretKey` / `keySecretKey`). Its CLIENT
# mounts THE SAME Secret and selects `ca.crt` alone (`caSecret` /
# `caSecretKey`), which is why `gateway` names `iam-tls` and `iam` names
# `iam-db-tls`. The client's volume selects one key, so the server's private key
# is not projected into the client's pod.
#
# ── RENEWAL, AND THE RESIDUAL THAT COMES WITH IT ────────────────────────────
# cert-manager renews about two thirds of the way through the duration and
# rewrites the Secret in place, with no human involved — the reason certificates
# are its job rather than the bootstrap Job's. A process that reads its
# certificate ONCE AT BOOT never sees that rewrite. With 90 days and a renewal
# window of thirty days or a little more — the ladder below moves each leaf's
# window, never its expiry — such a pod must restart within 90 days of its
# certificate being issued, or it serves an expired one.
#
# THAT RESIDUAL IS CLOSED FOR ALL FIVE PROCESSES, and TLS is on now, so it no
# longer blocks nothing. Every service carries the rotation watcher of ADR-0523
# — visible as `TLS_ROTATION_POLL_SECS` on their pods. It notices the rewrite,
# waits out a splay, drains and exits 0, and the pod comes back on the new
# material.
#
# **THREE, NOT FIVE, UNTIL 2026-09-05.** `iam-db` and `task-db` took
# `yadgar-lifecycle` with `default-features = false`, which compiled the watcher
# out entirely — and the same manifest line cost those two the expiry gauge,
# because `rotate` is the feature that owns
# `yadgar_tls_certificate_not_after_seconds`, so `TlsCertificateExpiringSoon`
# could not warn about `iam-db-tls` or `task-db-tls` either. The leaves with no
# watcher were exactly the leaves with no alert. `iam-db`#22 and `task-db`#37
# ("take the rotation watcher back") removed that line and wired
# `rotate::watch` into both `main.rs`, closing both halves at once.
#
# Read from source on each repository's `main`, and from the tags `argocd` pins
# — NOT from a scrape. This reference deployment's kind cluster carries no
# workloads, so no series was observed for either service.
#
# ── THE RENEWAL INSTANT IS STAGGERED, ONE SERVICE PER INSTANT ───────────────
# EVERY LEAF UNDER THIS DIRECTORY CARRIES A DISTINCT `renewBefore`. The values
# differ for a reason rather than by accident, so read this before adding one
# and before tidying them back to a single number.
#
# These certificates were all issued in one bootstrap, so a shared
# `renewBefore` gave them a shared renewal INSTANT. Measured against the live
# cluster on 2026-09-05: `.status.renewalTime` held three values for eight
# leaves, and `iam-tls`, `iam-db-tls`, `task-tls` and `task-db-tls` sat on the
# same second.
#
# THAT MATTERS BECAUSE OF ADR-0523. A process whose watched material changes
# waits out a random splay, drains, and EXITS 0. Every chart sets
# `tlsRotation.splayMaxSeconds: 300`, and each pod draws its splay from
# `[0, 300)` independently — which separates the two replicas of ONE service
# and does nothing at all to separate one service from another, because every
# service draws from the same interval starting at the same instant. Two
# services sharing an instant therefore put all four of their pods through a
# restart inside one five-minute window.
#
# A PodDisruptionBudget cannot hold that. A PDB constrains EVICTION, and a pod
# that exits 0 of its own accord was never evicted.
#
# THE INVARIANT THIS SCHEDULE BUYS: at every renewal instant, at most one
# service restarts. The closest two instants are 2h44m19s apart, against a
# 300-second splay window.
#
# ── WHY `renewBefore` AND NOT `duration` ────────────────────────────────────
# The argument is stronger than "the expiry does not move". `duration` is part
# of the certificate cert-manager ISSUED, so changing it makes the issued
# material differ from the spec and a re-issuance follows. `renewBefore` drives
# only the trigger controller's clock and is not compared against issued
# material, so changing it RESCHEDULES without minting anything.
#
# ── WHY A 6-HOUR LADDER, AND WHY IT CANNOT RE-LOCK ──────────────────────────
# `renewalTime = notAfter - renewBefore`, exactly — checked against all nine
# live rows, with no jitter of any kind. So a distinct `renewBefore` is a
# distinct instant AND a distinct period: a leaf renews every
# `duration - renewBefore`, which is 1434h at the near end of this ladder and
# 1398h at the far one.
#
# THE SEPARATIONS THEREFORE GROW RATHER THAN DRIFTING BACK TOGETHER, which is
# the property that makes this durable rather than a one-off nudge. Among
# leaves sharing a `notAfter`, the one that renews EARLIER has the LARGER
# `renewBefore` and so the SHORTER period, and moves earlier still on every
# cycle. Across the two `notAfter` groups the offset is 2h44m19s, which is not
# a multiple of the 6-hour step, so no number of cycles brings such a pair onto
# the same instant either. The margin is hours and cert-manager reconciles
# within minutes, so the algebra does not need to be exact to hold.
#
# A NEW CERTIFICATE TAKES THE NEXT STEP — 768h, then 774h. Never a value that
# is already in use.
#
# ── 720h IS DELIBERATELY UNUSED HERE ────────────────────────────────────────
# It belongs to the EDGE leaf, `infra/tls/certificate.yaml`, which is left
# alone rather than overlooked. Envoy Gateway reloads that one through xDS
# instead of restarting, and the only pod mounting its Secret is `iam`, which
# selects `ca.crt` — the authority, not the leaf. No process exits on it.
# Keeping it out of the ladder costs nothing and leaves every `renewBefore` in
# this repository distinct.
#
# ── DO NOT TRY TO ALIGN A SERVICE'S TWO CERTIFICATES ────────────────────────
# `iam` reads `iam-tls` and will read `iam-client-tls`; landing both on one
# instant so it restarts once instead of twice looks tempting and CANNOT BE
# MADE TO HOLD. After the first renewal `notAfter` is the renewal instant plus
# `duration`, so any alignment computed from today's `notAfter` dissolves on
# the first cycle. Two separate single-service restarts are the shape that
# survives, and each is smaller than the joint one would have been.
#
# ── `iam-db-tls` AND `task-db-tls` ARE STAGGERED, AND SOMETHING WATCHES THEM
# NOW ────────────────────────────────────────────────────────────────────────
# `iam-db` and `task-db` used to build `yadgar-lifecycle` with
# `default-features = false`, which compiled the rotation watcher — and the
# expiry gauge beside it — out of the binary entirely, so neither reacted to a
# renewal. `iam-db`#22 and `task-db`#37 ("take the rotation watcher back")
# removed that flag and wired `rotate::watch` into each `main.rs`, confirmed
# from source on each repository's main. They were scheduled here before that
# landed so the schedule was already correct on the day the watcher came
# back — which is exactly what has now happened.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: iam-tls
  namespace: yadgar
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  secretName: iam-tls
  commonName: iam
  dnsNames:
    - iam
    - iam.yadgar
    - iam.yadgar.svc
    - iam.yadgar.svc.cluster.local
  duration: 2160h # 90d, the same as the edge certificate
  renewBefore: 726h # 30d +6h; the ladder in this file's header
  privateKey:
    algorithm: ECDSA
    size: 256
    # A new key on every renewal. A long-lived key behind a short-lived
    # certificate makes the rotation cosmetic — the opposite choice from the
    # root, which is re-signed precisely so the bundle stays valid.
    rotationPolicy: Always
  usages:
    # `server auth` is the extended key usage a client checks. `digital
    # signature` is the plain key usage a TLS 1.3 handshake actually exercises,
    # named rather than left to cert-manager's defaults so that dropping a
    # default later cannot quietly break the handshake.
    #
    # THE ABSENCE OF `client auth` HERE IS NOW A SECURITY CONTROL, not only the
    # tidiness of naming what is used. Since client certificates were added
    # beside this file, ONE authority issues both directions, and what stops a
    # stolen SERVING certificate being replayed as a client credential is
    # exactly that this list NAMES `server auth` and not `client auth`. Adding
    # `client auth` here would silently remove the separation, with a Ready
    # certificate and a green sync.
    #
    # BUT THE WALL SEPARATES NAMED PURPOSES ONLY. IT ACCEPTS A LEAF THAT NAMES
    # NONE. rustls checks this through webpki's `KeyUsage::client_auth()` and
    # `KeyUsage::server_auth()`, and both are `required_if_present` rather than
    # `required` — read in rustls-webpki 0.103.15, where `check_eku` hands
    # `validate` an EMPTY iterator when the extension is absent and `validate`
    # returns `Ok` for exactly that case. So a leaf carrying NO extended key
    # usage at all passes BOTH checks. Confirmed by probe in both directions
    # rather than by reading alone: such a leaf is accepted as a client
    # credential AND as a serving one.
    #
    # SO THE TRAP IS OMITTING `usages`, NOT ONLY WIDENING IT — and omitting it
    # is the DEFAULT. cert-manager's own CRD text says a Certificate with no
    # `usages` gets `digital signature and key encipherment`, which is no
    # extended key usage at all. A leaf added to this file without this block
    # is therefore valid in BOTH directions, silently.
    #
    # A pre-commit hook refuses both shapes — an absent or empty `usages`, and
    # a `usages` naming `server auth` and `client auth` together — for every
    # Certificate UNDER `infra/` that names this issuer. That scope is the whole
    # of it: a Certificate defined anywhere else, in a chart or another
    # repository, names the same issuer and is gated by nothing. That is the
    # gate; review is no longer the only thing standing here. See the header of
    # client-certificates.yaml.
    - server auth
    - digital signature
  issuerRef:
    name: yadgar-internal-ca
    kind: Issuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: iam-db-tls
  namespace: yadgar
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  secretName: iam-db-tls
  commonName: iam-db
  # HEADLESS, so this name resolves to every ready pod rather than to one
  # virtual IP. The certificate still names the SERVICE, because that is the
  # name the client verifies against however many addresses it dialled.
  dnsNames:
    - iam-db
    - iam-db.yadgar
    - iam-db.yadgar.svc
    - iam-db.yadgar.svc.cluster.local
  duration: 2160h # 90d
  renewBefore: 738h # 30d +18h; the ladder in this file's header
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - server auth
    - digital signature
  issuerRef:
    name: yadgar-internal-ca
    kind: Issuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: task-tls
  namespace: yadgar
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  secretName: task-tls
  commonName: task
  dnsNames:
    - task
    - task.yadgar
    - task.yadgar.svc
    - task.yadgar.svc.cluster.local
  duration: 2160h # 90d
  renewBefore: 732h # 30d +12h; the ladder in this file's header
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - server auth
    - digital signature
  issuerRef:
    name: yadgar-internal-ca
    kind: Issuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: task-db-tls
  namespace: yadgar
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  secretName: task-db-tls
  commonName: task-db
  dnsNames:
    - task-db
    - task-db.yadgar
    - task-db.yadgar.svc
    - task-db.yadgar.svc.cluster.local
  duration: 2160h # 90d
  renewBefore: 744h # 30d +24h; the ladder in this file's header
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    name: yadgar-internal-ca
    kind: Issuer
    group: cert-manager.io
  usages:
    - server auth
    - digital signature
