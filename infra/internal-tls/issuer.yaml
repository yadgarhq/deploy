# The internal trust anchor: a root the cluster mints for itself, on first sync,
# with nobody minting anything.
#
# ── WHY THIS IS SELF-BOOTSTRAPPING AND THE EDGE IS NOT ──────────────────────
# infra/tls/clusterissuer.yaml carries the opposite decision, and it is still
# right there. Read the two together, because the difference between them is a
# property of the RELYING PARTIES rather than a preference:
#
#   - The EDGE certificate is verified by clients OUTSIDE the cluster — a
#     browser, `curl` on the host, a VM. Their trust store is configured once
#     and outlives `kind delete cluster`, so a root regenerated with the cluster
#     stops chaining to anything trusted and the failure reads as an opaque TLS
#     error rather than as "the CA changed". ADR-0490 rejected a self-signed
#     in-cluster root for exactly that, and nothing here disturbs it.
#
#   - THIS root's only relying parties are PODS, and each of them reads the
#     bundle out of a Secret that is regenerated with the cluster. There is no
#     trust store anywhere to go stale. A fresh root on a fresh cluster costs
#     nothing, because everything that would have to be told about it is created
#     at the same moment.
#
# The boundary is trust-anchor distribution, not convenience. Where an anchor
# has to be distributed to something the deployment does not own, a human mints
# it; where it does not, the deployment mints it.
#
# ── WHY CERT-MANAGER AND NOT THE BOOTSTRAP JOB ──────────────────────────────
# The alternative considered was generating a CA and four long-lived leaves in
# the same idempotent Job that creates the passwords, and dropping cert-manager
# from the internal path. It is rejected because ITS ONLY BENEFIT IS NOT
# AVAILABLE. That benefit would be one fewer operator and one fewer CRD — but
# cert-manager stays in this deployment regardless, since the edge needs it
# under D71 and ADR-0490, and the MariaDB operator already runs a certificate
# controller of its own. So the Job shape removes no dependency and gives up the
# one thing cert-manager is here for: it issues AND RENEWS without being asked,
# which ADR-0517 names as the reason certificates are its job rather than a
# Job's. Nothing renews a certificate a shell script wrote, so expiry becomes an
# outage on a date nobody is watching.
#
# D80 IS UNAFFECTED EITHER WAY, which is what makes this a free choice. No
# module chart requires a CRD: the services take file paths and a flag, and an
# adopter who replaces this directory with Vault, a mesh or an `openssl` script
# populates the same four Secrets and touches no service.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: yadgar-internal-selfsign
  namespace: yadgar
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  # The one-line issuer whose whole job is to sign the root below. cert-manager
  # has no "generate a CA" verb; a self-signed Issuer signing an `isCA`
  # Certificate is how it is spelled.
  selfSigned: {}
---
# The root itself. Its private key is generated by cert-manager, lives only in
# the Secret below, and is never in git, never in 1Password and never on a
# laptop — which is the whole difference from the edge root.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: yadgar-internal-ca
  namespace: yadgar
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  isCA: true
  secretName: yadgar-internal-ca
  commonName: yadgar internal CA

  # TEN YEARS, and the asymmetry with the ninety-day leaves below is deliberate.
  # Rotating this root means every client holding the old bundle stops trusting
  # every server, and clients read their bundle once at boot — so a root
  # rotation is a coordinated restart of the whole estate rather than a
  # background event. Making it rare is the correct trade for material that
  # never leaves the cluster and protects a pod network.
  duration: 87600h # 10y
  renewBefore: 8760h # 1y

  privateKey:
    algorithm: ECDSA
    size: 256
    # NEVER, unlike the leaves. Re-signing the same public key on renewal keeps
    # the bundle a client already holds valid; minting a new key would break
    # every consumer at the moment of renewal instead of at expiry.
    rotationPolicy: Never

  # A CA signs certificates and revocation lists. It serves nothing itself, so
  # `server auth` is deliberately absent.
  usages:
    - cert sign
    - crl sign

  issuerRef:
    name: yadgar-internal-selfsign
    kind: Issuer
    group: cert-manager.io
---
# The issuer the service certificates actually name.
#
# NAMESPACED, not a ClusterIssuer, and that is the least-privilege choice: a
# ClusterIssuer reads its key from cert-manager's own namespace and can be named
# by a Certificate in ANY namespace. This one reads the Secret above from
# `yadgar` and can only be used from `yadgar`, which is where every service that
# should hold this trust already lives.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: yadgar-internal-ca
  namespace: yadgar
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  ca:
    secretName: yadgar-internal-ca
