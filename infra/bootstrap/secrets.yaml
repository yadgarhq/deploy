# The three machine-only credentials a first sync used to ask a human for.
#
# ADR-0517: anything the deployment can generate for itself, it generates.
# Before this, `git clone && argocd sync` against an empty cluster did not come
# up — `valkey` and `nats` each waited on a Secret an operator had to mint out
# of MIGRATION_NOTES.md. `nats-auth-gateway` (gateway#17) followed the same
# path rather than growing a manual step of its own. None of the three is ever
# read by a person, so nothing is lost by nobody knowing them.
#
# THREE, NOT FOUR. `iam-keys` is deliberately NOT here — see the comment where
# it would have gone, at the bottom of the script.
#
# ── A JOB, NOT A HELM HOOK WITH `lookup` ────────────────────────────────────
# The alternative shape is a chart whose pre-install hook calls `lookup` to see
# whether the Secret already exists and generates only if it does not. It is
# rejected here for a reason specific to this deployment rather than on taste:
# Argo CD renders charts with `helm template`, which has NO cluster connection,
# and `lookup` returns an empty map whenever there is none. The hook would
# therefore believe every Secret absent on every sync and regenerate both — under
# `selfHeal: true`, on a schedule. That is exactly the live-credential rotation
# ADR-0517 forbids, and it would arrive silently.
#
# It is also moot twice over: `infra/` is plain manifests with no chart of ours
# to hang a hook on, and `nats` is an upstream chart nobody here should be
# patching hooks into.
#
# ── IDEMPOTENCE IS ENFORCED BY THE API SERVER ───────────────────────────────
# The script does NOT read first and write second. It POSTs, and treats the 409
# AlreadyExists it gets on every run after the first as success. There is no
# check-then-act window because there is no check, and the Role in rbac.yaml
# grants `create` alone — so this Job could not overwrite a live credential even
# if the script were wrong. The Secrets in a running cluster are left byte for
# byte as they are.
#
# ── WHY THIS IS NOT A PORTABILITY PROBLEM (D80) ─────────────────────────────
# Every consumer takes a FILE PATH and knows nothing about how the file arrived.
# An adopter running Vault, External Secrets, SOPS or a cloud secret manager
# deletes this Application, populates the same three Secret names, and changes
# no service. That is the whole reason the generation lives in the reference
# deployment rather than in a module chart.
apiVersion: batch/v1
kind: Job
metadata:
  name: bootstrap-secrets
  namespace: yadgar
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    # A Job's `spec.template` and `selector` are immutable, so an ordinary apply
    # fails the moment the script below changes — and that sync failure, not the
    # script, is what an operator would then have to diagnose. Replace+Force has
    # Argo delete and recreate it instead, which also re-runs the bootstrap when
    # a credential is ADDED here later. Re-running is safe by construction: see
    # the 409 above.
    #
    # SO A RESYNC LOOP HERE IS NOISE, NOT DAMAGE. If this Job ever reads as
    # OutOfSync — the server adds `batch.kubernetes.io/controller-uid` to the
    # template and a `selector` of its own — `selfHeal` will recreate it on
    # every reconcile. Each run answers 409 twice and changes nothing.
    # Anybody who notices the churn should read it as cosmetic rather than go
    # hunting for a bug.
    argocd.argoproj.io/sync-options: Replace=true,Force=true
spec:
  # Four attempts, because the failures worth retrying are a rescheduled pod and
  # an API server that is briefly unreachable. A 403 does not become a 201 on
  # the fourth try, and the Job going Failed at wave -12 stops every later wave
  # — which is the correct loud failure: the estate cannot come up without these
  # Secrets, so an operator should be looking at this Job rather than at a pod
  # stuck in ContainerCreating with nothing to explain it.
  backoffLimit: 4
  template:
    metadata:
      labels: { app.kubernetes.io/name: bootstrap-secrets }
    spec:
      serviceAccountName: bootstrap-secrets
      automountServiceAccountToken: true
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 100
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: bootstrap
          # curl and a shell, pinned. The official curl project image rather
          # than a `kubectl` one: `registry.k8s.io/kubectl` is distroless with
          # `/bin/kubectl` as its entrypoint and NO SHELL, which cannot run a
          # script at all, and the Bitnami images this repository already avoids
          # cannot be pulled at a pinned tag (see infra/valkey/valkey.yaml).
          #
          # The Kubernetes API is a REST API and this needs two POSTs, so
          # `kubectl` was never buying anything here beyond a larger image.
          image: curlimages/curl:8.16.0
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            # `$(...)` BELOW IS THE SHELL'S, NOT KUBERNETES'. Kubernetes does
            # expand `$(VAR)` inside `command` and `args`, but only where VAR
            # names an environment variable of this container, and an
            # unresolvable reference is documented to be left unchanged. This
            # container declares no environment at all, so every substitution
            # here reaches /bin/sh untouched.
            - |
              set -eu

              api="https://kubernetes.default.svc"
              sa="/var/run/secrets/kubernetes.io/serviceaccount"
              ns="$(cat "$sa/namespace")"
              token="$(cat "$sa/token")"

              # POST one Secret and classify the answer. 201 is a first run and
              # 409 is every run after it; ANYTHING ELSE IS A FAILURE and stops
              # the Job. A 403 from a mis-bound Role in particular must not be
              # read as "it already exists" — that reading reports a healthy
              # bootstrap while every consumer waits on a Secret nobody created,
              # with nothing pointing at the cause.
              #
              # The body arrives on STDIN rather than as an argument, so the
              # generated credential never enters this container's process
              # table.
              create() {
                code="$(curl --silent --show-error \
                  --cacert "$sa/ca.crt" \
                  --header "Authorization: Bearer $token" \
                  --header "Content-Type: application/json" \
                  --data-binary @- \
                  --output /dev/null --write-out '%{http_code}' \
                  "$api/api/v1/namespaces/$ns/secrets")"
                case "$code" in
                  201) echo "$1: created" ;;
                  409) echo "$1: already exists, left untouched" ;;
                  *) echo "$1: refused with HTTP $code" >&2; exit 1 ;;
                esac
              }

              # A password in the exact shape MIGRATION_NOTES.md used to ask a
              # human for: 33 random bytes as base64, and NO TRAILING NEWLINE.
              # The newline is load-bearing by its absence — a `\n` on the
              # server's copy of a `requirepass` but not on the client's is a
              # WRONGPASS with no visible cause. 33 bytes rather than 32 so the
              # base64 carries no `=` padding for anyone to trim.
              password() { head -c 33 /dev/urandom | base64 | tr -d '\n'; }

              # `stringData` rather than `data`: the API server stores the bytes
              # given, so what lands is the password and nothing appended.
              create valkey-password <<JSON
              {"apiVersion":"v1","kind":"Secret","type":"Opaque",
               "metadata":{"name":"valkey-password"},
               "stringData":{"password":"$(password)"}}
              JSON

              create nats-auth <<JSON
              {"apiVersion":"v1","kind":"Secret","type":"Opaque",
               "metadata":{"name":"nats-auth"},
               "stringData":{"password":"$(password)"}}
              JSON

              # `gateway`'s broker credential (gateway#17), a SEPARATE Secret
              # from `nats-auth` rather than a second key on it — this Job's
              # Role grants `create` alone (rbac.yaml), so a key added to an
              # already-created Secret would 409 forever and never land.
              create nats-auth-gateway <<JSON
              {"apiVersion":"v1","kind":"Secret","type":"Opaque",
               "metadata":{"name":"nats-auth-gateway"},
               "stringData":{"password":"$(password)"}}
              JSON

              # ── `iam-keys` DOES NOT BELONG HERE. DO NOT ADD IT. ──────────
              # One more service credential, `iam`'s encryption keys, also
              # waits on a Secret it cannot start without, and the obvious next
              # commit adds a fourth `create` here. It is deliberately absent,
              # and this comment exists because the absence looks like an
              # oversight and is not.
              #
              # `iam-keys` IS A THIRD CATEGORY THAT ADR-0517 DOES NOT COVER.
              # The two counts in this comment are of different things and are
              # both right: a fourth CREDENTIAL, and a third CATEGORY.
              # The ADR splits credentials in two — machine-only, where losing
              # one costs a rotation, and human-facing, which must be
              # retrievable once. These keys are neither. They are
              # DATA-BEARING: every stored name is AES-256-GCM ciphertext and
              # every username is found through an HMAC blind index, so losing
              # them destroys the data rather than costing a rotation.
              #
              # FOR THAT CATEGORY THE RULE INVERTS, and the loud refusal to
              # boot is the feature rather than the cost of not having built
              # this yet. Generate it here and a cluster whose Secret is gone
              # but whose database survived gets an `iam` that STARTS AND
              # CANNOT DECRYPT THE ROWS IT ALREADY HAS — a service that is
              # broken while reporting healthy. Leave it out and the same
              # cluster gets a pod that will not start and says which file is
              # missing. The second is strictly better, and it is the only
              # signal that the keys were lost at all.
              #
              # So a fresh cluster costs ONE manual step, at the top of
              # MIGRATION_NOTES.md, and that step is a decision rather than a
              # gap in this Job.
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
