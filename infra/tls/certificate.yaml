# The gateway's serving certificate.
#
# Lives in `yadgar`, the same namespace as the Gateway that consumes it. Gateway
# API will not read a TLS secret across namespaces without a ReferenceGrant, and
# keeping both here means there is no grant to forget — one fewer object whose
# absence produces a Gateway that is Accepted but not Programmed.
#
# cert-manager renews at two thirds of the duration and rewrites the secret in
# place; Envoy Gateway picks the new material up without a restart. That
# automatic renewal is the whole reason cert-manager is here rather than an
# `openssl` certificate pasted into a secret: a hand-made certificate expires
# with no warning and no mechanism, and the first symptom is a client failing to
# connect months later.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: gateway-tls
  namespace: yadgar
spec:
  secretName: gateway-tls

  # .test, and the change away from .localhost was forced by measurement.
  #
  # RFC 6761 reserves BOTH, but it reserves them for opposite behaviours. For
  # .localhost §6.3.3 tells resolvers to "always return the IP loopback address",
  # so no client on another machine can ever reach a .localhost name — an
  # /etc/hosts entry pointing gateway.yadgar.localhost at this host's bridge
  # address 192.168.122.1 was IGNORED from a Debian VM, and curl tried [::1] and
  # 127.0.0.1 instead. For .test §6.2.3 says the opposite: send the query to the
  # configured caching DNS server. Nothing forces .test to loopback, so it can
  # resolve wherever the local network says. Confirmed on this host:
  # `resolvectl query gateway.yadgar.localhost` answers 127.0.0.1 marked
  # "Data from: synthetic", while `resolvectl query gateway.yadgar.test` returns
  # a plain not-found — no synthesis, an ordinary name.
  #
  # STILL NOT .local, which RFC 6762 reserves for mDNS — Avahi and
  # systemd-resolved intercept that, and the resulting failures read as a cluster
  # problem rather than a naming one.
  #
  # The name must also satisfy the root's nameConstraints extension, which
  # permits only DNS names under yadgar.test. A name outside that is rejected at
  # verification even though signing succeeds, so this list and the constraint in
  # MIGRATION_NOTES have to agree — and the root that carries the OLD constraint
  # cannot sign this name usefully, which is why the CA is reissued BEFORE this
  # merges.
  dnsNames:
    - gateway.yadgar.test
  commonName: gateway.yadgar.test

  duration: 2160h # 90d, cert-manager's default, stated rather than implied
  renewBefore: 720h # 30d

  privateKey:
    algorithm: ECDSA
    size: 256
    # Renewal mints a new key rather than re-signing the old one. A long-lived
    # key behind a short-lived certificate makes the rotation cosmetic.
    rotationPolicy: Always

  usages:
    - server auth

  issuerRef:
    name: yadgar-dev-ca
    kind: ClusterIssuer
    group: cert-manager.io
