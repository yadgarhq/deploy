# The gateway's serving certificate.
#
# Lives in `yadgar`, the same namespace as the Gateway that consumes it. Gateway
# API will not read a TLS secret across namespaces without a ReferenceGrant, and
# keeping both here means there is no grant to forget — one fewer object whose
# absence produces a Gateway that is Accepted but not Programmed.
#
# cert-manager renews at two thirds of the duration and rewrites the secret in
# place; Envoy Gateway picks the new material up without a restart. That
# automatic renewal is the whole reason cert-manager is here rather than an
# `openssl` certificate pasted into a secret: a hand-made certificate expires
# with no warning and no mechanism, and the first symptom is a client failing to
# connect months later.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: gateway-tls
  namespace: yadgar
spec:
  secretName: gateway-tls

  # .internal, and the change away from .localhost was forced by measurement.
  #
  # .localhost does not fail cleanly, and that is the problem with it. RFC 6761
  # §6.3.3 says name resolution APIs "SHOULD always return the IP loopback
  # address" for .localhost names. It is a SHOULD, and clients on one machine
  # honour it differently. Measured on a Debian 13 guest with an /etc/hosts
  # entry naming this host's bridge address 192.168.122.1: `getent ahosts`,
  # Python's getaddrinfo and `wget` all resolved gateway.yadgar.localhost to
  # 192.168.122.1, and wget reached the gateway with the CA supplied and no
  # verification skipped (405). curl 8.14.1 returned loopback for the same name
  # on the same machine — it implements §6.3.3 itself and never consults NSS.
  # So the name resolves for some clients and not for others, and the client it
  # fails under is curl, which is the first tool anyone reaches for to diagnose
  # it. A name that fails cleanly everywhere would be easier to live with.
  #
  # .internal is reserved by ICANN Board Resolution 2024.07.29.06 (2024-07-29),
  # which withholds it from delegation in the DNS root zone permanently for
  # private-use applications. It is NOT an IETF special-use domain — no RFC
  # assigns it, and it is absent from IANA's Special-Use Domain Names registry —
  # so NO RESOLVER GIVES IT SPECIAL TREATMENT. That is the property .localhost
  # lacked and the whole reason for choosing it. .test, the earlier candidate,
  # actually has the stronger protocol backing (RFC 6761 §6.2); it loses on
  # being documented as a name for throwaway testing.
  #
  # STILL NOT .local, which RFC 6762 reserves for mDNS — Avahi and
  # systemd-resolved intercept that, and the resulting failures read as a cluster
  # problem rather than a naming one.
  #
  # The name must also satisfy the root's nameConstraints extension, which
  # permits only DNS names under yadgar.internal. A name outside that is
  # rejected at verification even though signing succeeds, so this list and the
  # constraint in MIGRATION_NOTES have to agree — and the root that carries the
  # OLD constraint cannot sign this name usefully, which is why the CA is
  # reissued BEFORE this merges.
  dnsNames:
    - gateway.yadgar.internal
  commonName: gateway.yadgar.internal

  duration: 2160h # 90d, cert-manager's default, stated rather than implied
  renewBefore: 720h # 30d

  privateKey:
    algorithm: ECDSA
    size: 256
    # Renewal mints a new key rather than re-signing the old one. A long-lived
    # key behind a short-lived certificate makes the rotation cosmetic.
    rotationPolicy: Always

  usages:
    - server auth

  issuerRef:
    name: yadgar-dev-ca
    kind: ClusterIssuer
    group: cert-manager.io
