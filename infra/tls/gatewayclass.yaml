# The GatewayClass Envoy Gateway watches.
#
# The chart does NOT create one — verified by rendering it (`helm template` emits
# no GatewayClass), and Envoy Gateway's own quickstart has the user apply it
# separately. A Gateway naming a class nobody created stays Accepted=False with
# no controller ever looking at it, which reads as a broken Gateway rather than a
# missing object.
#
# The controller name is not a convention to guess at — it is the value the
# chart's own `config.envoyGateway.gateway.controllerName` default carries, taken
# from `helm show values` at 1.9.1.
#
# NO parametersRef here, deliberately. Infrastructure configuration attaches at
# the Gateway instead (`spec.infrastructure.parametersRef`), which keeps the
# EnvoyProxy in the same namespace as the Gateway that uses it. Envoy Gateway's
# own documentation discourages the GatewayClass-level form once more than one
# Gateway shares a class and wants different infrastructure — and a cluster-scoped
# object pointing into one namespace is the kind of coupling that is easy to add
# and awkward to unpick.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: eg
  # NEVER PRUNED BY THIS APPLICATION, so step 7 of
  # `plans/retiring-the-deploy-copies.md` hands this object to the `yadgar`
  # Application as an adoption rather than a delete-and-recreate. Step 7
  # deletes this file and sets `platform.gatewayListener.create`, which renders this
  # object under the same name. Two automated Applications then act on one
  # name on their own jitter, and at step 3 (deploy#58) the prune won that
  # race for `valkey-ingress`. With this option, `tls` skips the prune and
  # `yadgar` rewrites the tracking-id on the same object.
  # The envoy Service and Deployment in `envoy-gateway-system` carry an
  # ownerReference to THIS object, so a recreated class garbage-collects the
  # data plane.
  #
  # IT MUST BE LIVE BEFORE THAT MERGE. The option protects only an object that
  # already carries it, so this file syncs first and the deletion follows.
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
