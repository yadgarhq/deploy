# The development trust anchor.
#
# The CA's private key is NOT in git and is not generated by cert-manager. It is
# minted once by hand, kept in 1Password, and loaded into the cluster as a secret
# — see MIGRATION_NOTES.md. cert-manager signs with it; it never owns it.
#
# WHY NOT LET CERT-MANAGER MINT ITS OWN ROOT. cert-manager's documented shortcut
# is a SelfSigned issuer bootstrapping a root, which works and needs no manual
# step — but that root is regenerated whenever the cluster is rebuilt, while the
# root NixOS trusts stays the same. The certificate the gateway serves then stops
# chaining to anything trusted, and the failure surfaces as an opaque TLS error
# rather than as "the CA changed". The predictable next move is `-k`, or
# `insecure-skip-verify`, which removes exactly the property this exists to test.
# An external root survives `kind delete cluster`.
#
# WHY NOT LET'S ENCRYPT. HTTP-01 requires Let's Encrypt to reach this host on
# public port 80; the cluster answers on localhost:18443. DNS-01 works without
# inbound reachability but needs a real public domain plus its DNS credentials in
# the dev cluster — public PKI, and a live domain's keys, for traffic that never
# leaves the machine.
#
# CLUSTER-SCOPED, so the secret below is read from cert-manager's own namespace
# (its --cluster-resource-namespace, which defaults to where it is installed) and
# not from whichever namespace asks for a certificate.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: yadgar-dev-ca
spec:
  ca:
    # Created by hand from 1Password. Absent until MIGRATION_NOTES step 3 has
    # run, and until then this issuer reports NotReady — which is the correct
    # loud failure rather than a silent fallback to an untrusted certificate.
    secretName: yadgar-dev-ca
