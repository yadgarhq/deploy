# The edge itself. One listener, HTTPS only.
#
# NO PLAINTEXT LISTENER, deliberately. A port-80 listener would exist only to
# redirect, and until something needs redirecting it is a way to serve MCP over
# plaintext by accident — the gateway attests caller identity (ADR-0488), so an
# unencrypted path past it is worth more than the convenience. kind's 18080→30080
# mapping is therefore unused for now, and that is a spare door rather than a
# missing one.
#
# The certificate comes from infra/tls/certificate.yaml in this same namespace.
# Gateway API will not read a TLS secret across namespaces without a
# ReferenceGrant, and keeping both here means there is no grant to forget.
#
# `hostname` is what the certificate is issued for and what the root's
# nameConstraints extension permits. All three have to agree — the certificate's
# dnsNames, this hostname, and the CA's constraint — or verification fails after
# signing succeeds, which is a confusing place to discover a typo. A fourth place
# agrees with them from another repository: `gateway.hostname` in the gateway
# chart, which is the hostname on the HTTPRoute that attaches here.
#
# .internal rather than .localhost, because .localhost does not fail cleanly:
# RFC 6761 §6.3.3 asks resolvers to send it to loopback, and clients on one
# machine disagree about whether to. Measured off-host, getent, Python and wget
# reached the gateway through a .localhost name while curl did not — curl
# implements §6.3.3 itself and never consults NSS. .internal is reserved by ICANN
# from the DNS root zone for private use and is special-cased by nothing. The
# reasoning, and the measurement it rests on, are recorded in full on the
# Certificate beside this file.
#
# ─────────────────────────────────────────────────────────────────────────────
# RENAMING THIS Gateway BREAKS TWO ALLOW-LISTS, AND NOTHING WILL REFUSE THE
# MISMATCH
# ─────────────────────────────────────────────────────────────────────────────
#
# `metadata.name` and `metadata.namespace` below are not only this object's
# identity. Envoy Gateway DERIVES two labels from them and stamps them onto every
# data-plane pod it creates for this Gateway:
# `gateway.envoyproxy.io/owning-gateway-name` and
# `gateway.envoyproxy.io/owning-gateway-namespace`.
#
# TWO NetworkPolicies SELECT THOSE PODS BY THOSE LABELS:
#
# - infra/network-policies/gateway-ingress.yaml — the edge's ingress allow-list,
#   and the ONLY control at the gateway hop (ADR-0685). Rename this Gateway and
#   that allow-list matches no pod, so EVERY EXTERNAL CALL TIMES OUT — while both
#   gateway pods stay Ready with zero restarts, the EndpointSlice keeps both
#   addresses, and nothing is logged.
# - infra/estate-front/networkpolicy.yaml rule (b) — the CI runner's only
#   permitted route to the edge.
#
# A NetworkPolicy whose selector matches nothing is accepted by the API server,
# listed by `kubectl get netpol` and printed in full by `kubectl describe`.
# Nothing in this estate refuses it; ADR-0685 records that as unclosed, and only
# a negative test finds it. ADR-0685 places gateway-ingress.yaml in THIS
# repository precisely so that the rename and the allow-list are ONE reviewable
# diff. If you change either of the two lines below, change both of those files
# in the same commit.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: edge
  namespace: yadgar
spec:
  gatewayClassName: eg

  # Attached HERE rather than on the GatewayClass, so the EnvoyProxy lives beside
  # the Gateway it configures instead of a cluster-scoped object reaching into one
  # namespace. namespace is implicit at this level: same as the Gateway.
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: edge

  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: gateway.yadgar.internal
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: gateway-tls
      allowedRoutes:
        namespaces:
          # `yadgar` only. Routes are attached by the modules being fronted, and
          # every one of them lives here (D54).
          from: Same
