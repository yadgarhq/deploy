# Network policies for the shared infrastructure (ledger 518).
#
# **ENFORCED ON THE REFERENCE CLUSTER.** This comment said "UNENFORCED … kind's
# CNI is kindnet, which does not implement NetworkPolicy" until ledger 896. That
# was false and had been since ledger 684: kindnetd v20260528-9350166c watches
# NetworkPolicy objects and drops what they do not allow, and ledger 511 measured
# twelve such drops across six module policies.
#
# What authenticates the shared broker is still the `authorization` block in
# infra/nats.yaml — server-side, so it holds on every CNI. These objects are the
# second layer, and they are a live one. Read
# infra/network-policies/nats-ingress.yaml for the measurements.
#
# THIS APPLICATION IS SHRINKING, one policy at a time. It held three; step 3 of
# `plans/retiring-the-deploy-copies.md` retired `valkey-ingress` to the parent
# chart's `platform.valkey.create`, step 6 retires `nats-ingress` the same way,
# and step 8 retires `gateway-ingress` and this file with it. The cache's own
# Application and manifests went with step 3, which is why nothing here names
# infra/valkey/ any more.
#
# ITS OWN Application rather than a file beside the workloads it selects, because
# the policies span workloads — one of which, NATS, is a Helm Application with no
# directory of its own to put a manifest in. One Application keeps the policy for
# a hop and the policy for its twin in one place.
#
# A LATER SYNC WAVE than the workloads it selects. A NetworkPolicy applied before
# the pods it names exist is not an error — the selector simply matches nothing
# and starts matching when they appear — but ordering it after them means a
# `kubectl get pod -l` check run straight after a sync answers the question the
# policy depends on.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: network-policies
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  project: default
  source:
    repoURL: https://github.com/yadgarhq/deploy
    targetRevision: main
    path: infra/network-policies
  destination:
    server: https://kubernetes.default.svc
    namespace: yadgar
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
