# The installation's configuration: the ConfigMaps every service reads its knobs
# out of (ADR-0569, ADR-0570).
#
# A FOREIGN `repoURL`, and the only Application in this directory pointing at a
# yadgarhq repository that is not this one. That is deliberate and it is what
# ADR-0569 asks for: the settings live in ONE repository rather than scattered
# through the deployment repository mixed in with infrastructure.
#
# DO NOT COPY THIS FILE TO ADOPT THE ESTATE, and an earlier version of this
# comment said the opposite. It said adopting meant FORKING `yadgarhq/config`.
# ADR-0705 reverses exactly that: an installation REFERENCES the configuration
# chart as a pinned OCI artifact from its own GitOps repository and clones
# nothing. The worked example an adopter copies is `example/application.yaml` in
# `yadgarhq/config`, which is single-source against
# `oci://ghcr.io/yadgarhq/charts/config` at a pinned version.
#
# THIS FILE IS THE OTHER SHAPE ON PURPOSE. It tracks `main` by a git path under
# D55 so a merge in `yadgarhq/config` reaches this reference cluster on the next
# reconciliation. That is right for the estate that OWNS the chart and wrong for
# an installation consuming it, which pins a version and bumps it deliberately.
#
# HERE RATHER THAN IN `yadgarhq/argocd`. That repository holds Argo's own values
# and the module generator; `root.yaml`'s include glob is
# `{applications,applicationsets}/*.yaml` and reaches nothing else. Configuration
# is not Argo, so it belongs in the infra app-of-apps with everything else that
# is not.
#
# NOT THROUGH THE MODULE ApplicationSet, even though `yadgarhq/config` has a
# `chart/` directory and would otherwise match. That generator also requires the
# `yadgar-deployable` topic, which this repository deliberately does not carry:
# every Application it generates is at sync wave 10, which is AFTER the modules
# that mount these ConfigMaps. Adding the topic would mint a second Application
# for the same chart at the wrong wave, and two Applications owning one object is
# a fight neither wins. `yadgarhq/config`'s README records the trap where the
# next person will be standing when they ask why it is not in the generator.
#
# WAVE -12, THE SAME FAMILY AS THE CREDENTIAL BOOTSTRAP, and for the reason that
# file states about itself: a thing that must exist before the things that
# reference it. A ConfigMap volume is `optional: false` by default, so a pod
# whose ConfigMap has not synced yet does not fail — it sits in
# `ContainerCreating` forever, exactly as a pod with a missing Secret does. That
# is the intended failure when a ConfigMap is genuinely absent and it is a stuck
# estate when it is merely late, so "before" here is ordering rather than
# preference. Modules are at wave 10.
#
# THESE ARE MOUNTED AND READ, and this paragraph previously said they were not.
# Every one of the SEVEN module charts — gateway, iam, iam-db, task, task-db,
# project, project-db — used to mount its OWN per-service ConfigMap from this
# chart, in addition to `shared`. Each has since dropped that per-service mount:
# `gateway` now renders its own ConfigMap `gateway-knobs` from its own chart
# (gateway#92, v0.9.49 — verified live in namespace `yadgar`) instead of pulling
# one from here, and the other six dropped their mount outright (iam#83,
# iam-db#70, task#67, task-db#76, project#22, project-db#45, all merged and
# rolled — every `config-<module>` volume is gone from the live Deployments).
# So all seven module charts mount exactly ONE object this chart still owns,
# `shared`, under `/etc/yadgar/config/shared`. (The earlier text this paragraph
# replaced claimed "the five services read the rotation schedule from
# environment variables", which was wrong three ways: there were seven
# services, not five; they mounted rather than read env; and `yadgar-lifecycle`
# reads NO environment variable at all — `Schedule::from_env` and its siblings
# were deleted in lifecycle v0.2.0, which ledger 602 measured.)
#
# TWO ConfigMaps, not nine and not seven. The template globs
# `chart/config/*.yaml`. Per ADR-0740, a configuration document moves into its
# reader's own chart once exactly one service reads it, and stays in this
# shared chart only when more than one service reads it, or none does yet.
# `shared.yaml` stays because every service reads it. `audit.yaml` stays
# because its reader count is ZERO, not one — no audit module exists yet to
# own it, so ADR-0740's move-it-to-its-reader rule has no destination for it.
# The seven per-service documents this chart once also held — gateway, iam,
# iam-db, task, task-db, project, project-db — have no reader left in this
# chart: `gateway` renders its own `gateway-knobs` ConfigMap from its own
# chart now (gateway#92), and the other six dropped their per-service mount
# outright (iam#83, iam-db#70, task#67, task-db#76, project#22, project-db#45).
# Recount by listing `chart/config/*.yaml` in the rendered chart, not by
# trusting this comment.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-12"
spec:
  project: default
  source:
    repoURL: https://github.com/yadgarhq/config
    # HEAD, like every other yadgarhq source here: development follows `main`
    # (D55). A configuration change is a merged pull request and the next
    # reconciliation, which is the same review gate every other change passes.
    targetRevision: main
    path: chart
  destination:
    server: https://kubernetes.default.svc
    # THE SERVICES' OWN NAMESPACE, and it has to be. A pod can only mount a
    # ConfigMap from the namespace it runs in, so configuration for `yadgar`
    # cannot live anywhere else.
    namespace: yadgar
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
