# k3d cluster for development (D55). Development happens here, not in a single
# process, because D18's cache coherence, D23's client-side load balancing and
# D47's atomic notice claim are all multi-replica behaviours that a `cargo run`
# loop cannot exhibit at all.
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: yadgar

servers: 1
# TWO agents, deliberately. One agent would schedule every replica onto the same
# node, and a single-node cluster reproduces the single-process blind spot this
# environment exists to remove: client-side balancing across pods that share a
# kubelet proves much less than balancing across nodes.
agents: 2

# NO k3d-MANAGED REGISTRY, and this is a podman constraint rather than a choice.
# k3d creates its registry node attached to a network literally named `bridge`,
# which does not exist under podman — and podman REFUSES to create one, because
# `bridge` is a reserved network *mode* name:
#   Error: cannot create network with name "bridge" because it conflicts with a
#   valid network mode
# Verified on podman 5.8.4 / k3d 5.9.0, 2026-08-29. Both documented workarounds
# are therefore closed.
#
# Image delivery is `k3d image import` instead, which loads into every node and
# needs no registry at all. D55's dev loop — one module's tag overridden while
# the rest stays GitOps — works the same either way. Revisit if import latency
# becomes the bottleneck: a standalone podman registry on an ordinary network,
# referenced through `registries.config` rather than `registries.create`, avoids
# the node k3d wants to build.

ports:
  # 8080 and 8443 are common and were already taken on the development machine.
  # The 18xxx range keeps the cluster out of the way of whatever else is running.
  - port: 18080:80
    nodeFilters: [loadbalancer]
  - port: 18443:443
    nodeFilters: [loadbalancer]

options:
  k3s:
    extraArgs:
      # Traefik ships with k3s; Argo CD brings its own ingress story and two
      # controllers fighting over Ingress objects is a debugging tax nobody
      # needs on day one.
      - arg: --disable=traefik
        nodeFilters: [server:*]
